<script>
    (() => {
      const t = localStorage.getItem('theme');
      const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark;
      const l = localStorage.getItem('lang');
      const lang = (l === 'en' || l === 'zh') ? l : 'zh';
      document.documentElement.dataset.lang = lang;
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    })();
</script>

<canvas id="particleCanvas" style="position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:-1;pointer-events:none;"></canvas>
<script>
(function(){
    const canvas = document.getElementById("particleCanvas");
    const gl = canvas.getContext("webgl");
    let width,height;
    function resize(){
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        gl.viewport(0,0,width,height);
    }
    resize();
    window.addEventListener("resize",resize);
    const vertexSource = `attribute vec2 a_pos;void main(){gl_Position=vec4(a_pos,0,1);gl_PointSize=3;}`;
    const fragSource = `precision mediump float;uniform float u_theme;void main(){float c = u_theme == 1 ? 0.3 : 0.8;gl_FragColor=vec4(c,c,c,0.2);}`;
    function createShader(type,source){
        const shader = gl.createShader(type);
        gl.shaderSource(shader,source);
        gl.compileShader(shader);
        return shader;
    }
    const program = gl.createProgram();
    gl.attachShader(program,createShader(gl.VERTEX_SHADER,vertexSource));
    gl.attachShader(program,createShader(gl.FRAGMENT_SHADER,fragSource));
    gl.linkProgram(program);
    gl.useProgram(program);
    const points = [];
    for(let i=0;i<800;i++){
        points.push(Math.random()*2-1,Math.random()*2-1);
    }
    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(points),gl.STATIC_DRAW);
    const aPos = gl.getAttribLocation(program,"a_pos");
    gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0);
    gl.enableVertexAttribArray(aPos);
    const uTheme = gl.getUniformLocation(program,"u_theme");
    function render(){
        const isDark = document.documentElement.dataset.theme === "dark";
        gl.uniform1f(uTheme,isDark ? 1 : 0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.POINTS,0,800);
        requestAnimationFrame(render);
    }
    render();
})();
</script>
