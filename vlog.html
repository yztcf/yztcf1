<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>动画作品滑动播放</title>
    <style>
        * {margin: 0;padding: 0;box-sizing: border-box;}
        html,body {height: 100%;overflow: hidden;background:#000;}

        /* 弹窗全屏容器，垂直单页布局，解决多屏错乱 */
        #douyin-modal {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            overflow: hidden;
            display:flex;
            flex-direction:column;
        }

        /* 滑动容器固定高度100vh，一次只显示一屏 */
        .douyin-container {
            width: 100%;
            height: 100vh;
            transition: transform 0.4s ease-out;
            touch-action: none;
            will-change: transform;
        }

        .douyin-slide {
            width: 100%;
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 自适应视频：手机铺满，电脑居中限制最大高度 */
        .douyin-video {
            width: 100%;
            max-height: 85vh;
            object-fit: contain;
        }
        @media (min-width:1024px){
            .douyin-video{
                width:auto;
                max-width:80vw;
            }
        }

        /* 底部进度条 */
        .progress-wrap {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            height: 6px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            cursor: pointer;
        }
        .progress-bar {
            height: 100%;
            background: #fff;
            border-radius: 3px;
            width: 0%;
        }

        /* 左下角文字信息 */
        .douyin-info {
            position: absolute;
            left: 20px;
            bottom: 120px;
            color: #fff;
        }
        .douyin-info h3 {
            font-size: 18px;
            margin-bottom: 6px;
        }
        .douyin-info p {
            font-size: 14px;
            color: #ddd;
        }

        /* 关闭按钮 */
        .douyin-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: none;
            z-index: 10;
            cursor: pointer;
        }
        .icon-svg {
            fill: #fff;
            width: 26px;
            height: 26px;
        }
        .nav-icon {
            fill: #fff;
            width: 22px;
            height: 22px;
        }

        /* 右侧上下切换按钮 + 圆点指示器 */
        .douyin-nav {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }
        .douyin-nav-btn {
            background: transparent;
            border: none;
            cursor: pointer;
        }
        .douyin-dots span {
            display: block;
            width: 8px;
            height: 8px;
            margin: 6px 0;
            border-radius: 50%;
            background: #666;
        }
        .douyin-dots span.active {
            background: #fff;
        }

        /* 底部操作提示 */
        .douyin-hint {
            color: #aaa;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            text-align:center;
        }
        /* 2倍速弹窗提示 */
        .speed-tip {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            color: #fff;
            font-size: 24px;
            background: rgba(0,0,0,0.4);
            padding: 8px 16px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>
<div class="douyin-modal" id="douyin-modal">
    <button class="douyin-close" id="douyin-close">
        <svg class="icon-svg" viewBox="0 0 448 512">
            <path d="M64 32C64 14.3 49.7 0 32 0S0 14.3 0 32V64 384 480c0 17.7 14.3 32 32 32s32-14.3 32-32V352l64.3-160.8c5.2-12.9 19.1-19.2 31.1-13.6l112 48c11.7 5 18.2 18.1 14.3 30.3L256 384v96c0 17.7 14.3 32 32 32s32-14.3 32-32V384 64 32c0-17.7-14.3-32-32-32s-32 14.3-32 32v224L133.7 195.2c-5.2-12.9-19.1-19.2-31.1-13.6L32 230.4V32z"/>
        </svg>
    </button>
    <div class="douyin-container" id="douyin-container">
        <!-- 视频1 -->
        <div class="douyin-slide" data-index="0">
            <video class="douyin-video" loop playsinline preload="auto" muted>
                <source src="static/videos/video1.mp4" type="video/mp4">
                浏览器不支持MP4视频
            </video>
            <div class="speed-tip">2x 倍速</div>
            <div class="progress-wrap">
                <div class="progress-bar"></div>
            </div>
            <div class="douyin-info">
                <h3>@一叶知秋 · 3D动画作品</h3>
                <p>科幻城市建模动画 #3D #动画 #C4D</p>
            </div>
        </div>
        <!-- 视频2 -->
        <div class="douyin-slide" data-index="1">
            <video class="douyin-video" loop playsinline preload="auto" muted>
                <source src="static/videos/video2.mp4" type="video/mp4">
                浏览器不支持MP4视频
            </video>
            <div class="speed-tip">2x 倍速</div>
            <div class="progress-wrap">
                <div class="progress-bar"></div>
            </div>
            <div class="douyin-info">
                <h3>@一叶知秋 · 创意短片</h3>
                <p>色彩与节奏的碰撞 #创意 #剪辑 #短片</p>
            </div>
        </div>
        <!-- 视频3 -->
        <div class="douyin-slide" data-index="2">
            <video class="douyin-video" loop playsinline preload="auto" muted>
                <source src="static/videos/video3.mp4" type="video/mp4">
                浏览器不支持MP4视频
            </video>
            <div class="speed-tip">2x 倍速</div>
            <div class="progress-wrap">
                <div class="progress-bar"></div>
            </div>
            <div class="douyin-info">
                <h3>@一叶知秋 · 广告拍摄</h3>
                <p>品牌宣传片段 #广告 #拍摄 #制作</p>
            </div>
        </div>
    </div>
    <div class="douyin-nav">
        <button class="douyin-nav-btn up" id="btn-up">
            <svg class="nav-icon" viewBox="0 0 320 512">
                <path d="M182.6 137.4c-12.5-12.5-32.8-12.5-45.3 0l-128 128c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L160 205.3l105.4 105.4c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3l-128-128z"/>
            </svg>
        </button>
        <div class="douyin-dots" id="dot-wrap"></div>
        <button class="douyin-nav-btn down" id="btn-down">
            <svg class="nav-icon" viewBox="0 0 320 512">
                <path d="M137.4 374.6c12.5 12.5 32.8 12.5 45.3 0l128-128c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L160 306.7 54.6 201.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l128 128z"/>
            </svg>
        </button>
    </div>
    <div class="douyin-hint">鼠标滚轮/手指上下滑动切换视频 · 长按视频2倍速 · 拖动进度条跳转</div>
</div>

<script>
const container = document.getElementById('douyin-container');
const slides = document.querySelectorAll('.douyin-slide');
const slideCount = slides.length;
let currentIndex = 0;
let touchStartY = 0;
let scrollLock = false;
const dotWrap = document.getElementById('dot-wrap');
let longPressTimer = null;
const LONG_PRESS_TIME = 150;

// 生成圆点指示器
function createDots() {
    dotWrap.innerHTML = '';
    for(let i=0; i<slideCount; i++) {
        const span = document.createElement('span');
        span.dataset.index = i;
        if(i === currentIndex) span.classList.add('active');
        dotWrap.appendChild(span);
    }
}
createDots();

// 更新页面、视频播放、进度条（修复play/pause中断报错）
function updateSlide() {
    container.style.transform = `translateY(-${currentIndex * 100}vh)`;
    document.querySelectorAll('.douyin-dots span').forEach(dot => {
        dot.classList.toggle('active', Number(dot.dataset.index) === currentIndex);
    })
    slides.forEach((slide, idx) => {
        const video = slide.querySelector('video');
        slide.querySelector('.progress-bar').style.width = '0%';
        if(idx === currentIndex) {
            // 进度条实时更新
            video.ontimeupdate = () => {
                const percent = (video.currentTime / video.duration) * 100;
                slide.querySelector('.progress-bar').style.width = percent + '%';
            }
            // 进度条点击跳转
            const progressWrap = slide.querySelector('.progress-wrap');
            progressWrap.onclick = (e) => {
                const rect = progressWrap.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const totalWidth = rect.width;
                const jumpTime = (clickX / totalWidth) * video.duration;
                video.currentTime = jumpTime;
            }
            // 修复play异步中断报错
            const playPromise = video.play();
            if (playPromise !== undefined) playPromise.catch(()=>{});
        } else {
            video.pause();
        }
    })
}

// 切上一条
function slideUp() {
    if(currentIndex > 0 && !scrollLock) {
        scrollLock = true;
        currentIndex--;
        updateSlide();
        setTimeout(()=>scrollLock=false,400);
    }
}
// 切下一条
function slideDown() {
    if(currentIndex < slideCount - 1 && !scrollLock) {
        scrollLock = true;
        currentIndex++;
        updateSlide();
        setTimeout(()=>scrollLock=false,400);
    }
}

// 电脑端鼠标滚轮优化：一次滚轮只切换1条，禁止连续滚动跳多屏
let wheelLock = false;
container.addEventListener('wheel', (e)=>{
    e.preventDefault();
    if(scrollLock || wheelLock) return;
    wheelLock = true;
    e.deltaY > 0 ? slideDown() : slideUp();
    setTimeout(()=>wheelLock=false,500);
})

// 手机触屏滑动 + 长按2倍速
container.addEventListener('touchstart', e => {
    touchStartY = e.touches[0].clientY;
    const slide = slides[currentIndex];
    const video = slide.querySelector('video');
    const speedTip = slide.querySelector('.speed-tip');
    longPressTimer = setTimeout(() => {
        video.playbackRate = 2;
        speedTip.style.display = 'block';
    }, LONG_PRESS_TIME);
})
container.addEventListener('touchmove', e => {
    e.preventDefault();
    clearTimeout(longPressTimer);
})
container.addEventListener('touchend', e => {
    clearTimeout(longPressTimer);
    // 恢复1倍速
    const slide = slides[currentIndex];
    const video = slide.querySelector('video');
    const speedTip = slide.querySelector('.speed-tip');
    video.playbackRate = 1;
    speedTip.style.display = 'none';

    const touchEndY = e.changedTouches[0].clientY;
    const diff = touchEndY - touchStartY;
    if(diff < -60) slideDown();
    if(diff > 60) slideUp();
})

// 上下按钮点击
document.getElementById('btn-up').addEventListener('click', slideUp);
document.getElementById('btn-down').addEventListener('click', slideDown);

// 点击视频暂停/播放
slides.forEach(slide => {
    const video = slide.querySelector('video');
    video.addEventListener('click', () => {
        video.paused ? video.play() : video.pause();
    })
})

// 关闭弹窗
document.getElementById('douyin-close').addEventListener('click', () => {
    document.getElementById('douyin-modal').style.display = 'none';
    slides.forEach(s => s.querySelector('video').pause());
})

window.onload = updateSlide;
</script>
</body>
</html>
