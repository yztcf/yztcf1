<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>动画作品滑动播放</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {margin: 0;padding: 0;box-sizing: border-box;}
        html,body {height: 100%;overflow: hidden;}

        #douyin-modal {
            display: flex !important;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            overflow: hidden;
        }

        .douyin-container {
            width: 100%;
            height: 100%;
            transition: transform 0.4s ease-out;
            touch-action: none;
        }

        .douyin-slide {
            width: 100%;
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .douyin-video {
            width: 100%;
            max-height: 85vh;
            object-fit: contain;
        }

        /* 底部进度条容器 */
        .progress-wrap {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            height: 6px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            cursor: pointer;
        }
        .progress-bar {
            height: 100%;
            background: #fff;
            border-radius: 3px;
            width: 0%;
        }

        .douyin-info {
            position: absolute;
            left: 20px;
            bottom: 120px;
            color: #fff;
        }
        .douyin-info h3 {
            font-size: 18px;
            margin-bottom: 6px;
        }
        .douyin-info p {
            font-size: 14px;
            color: #ddd;
        }

        .douyin-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            font-size: 26px;
            background: transparent;
            border: none;
            z-index: 10;
            cursor: pointer;
        }

        .douyin-nav {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }
        .douyin-nav-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
        }
        .douyin-dots span {
            display: block;
            width: 8px;
            height: 8px;
            margin: 6px 0;
            border-radius: 50%;
            background: #666;
        }
        .douyin-dots span.active {
            background: #fff;
        }

        .douyin-hint {
            color: #aaa;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
        }
        /* 倍速提示文字 */
        .speed-tip {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            color: #fff;
            font-size: 24px;
            background: rgba(0,0,0,0.4);
            padding: 8px 16px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>
<div class="douyin-modal" id="douyin-modal">
    <button class="douyin-close" id="douyin-close"><i class="fas fa-times"></i></button>
    <div class="douyin-container" id="douyin-container">
        <!-- 第1条动画视频 -->
        <div class="douyin-slide" data-index="0">
            <video class="douyin-video" loop playsinline preload="auto" muted autoplay>
                <source src="static/videos/video1.mp4" type="video/mp4">
                浏览器不支持MP4视频
            </video>
            <!-- 倍速提示 -->
            <div class="speed-tip">2x 倍速</div>
            <!-- 进度条 -->
            <div class="progress-wrap">
                <div class="progress-bar"></div>
            </div>
            <div class="douyin-info">
                <h3>@一叶知秋 · 3D动画作品</h3>
                <p>科幻城市建模动画 #3D #动画 #C4D</p>
            </div>
        </div>
        <!-- 第2条动画视频 -->
        <div class="douyin-slide" data-index="1">
            <video class="douyin-video" loop playsinline preload="auto" muted autoplay>
                <source src="static/videos/video2.mp4" type="video/mp4">
                浏览器不支持MP4视频
            </video>
            <div class="speed-tip">2x 倍速</div>
            <div class="progress-wrap">
                <div class="progress-bar"></div>
            </div>
            <div class="douyin-info">
                <h3>@一叶知秋 · 创意短片</h3>
                <p>色彩与节奏的碰撞 #创意 #剪辑 #短片</p>
            </div>
        </div>
        <!-- 第3条动画视频 -->
        <div class="douyin-slide" data-index="2">
            <video class="douyin-video" loop playsinline preload="auto" muted autoplay>
                <source src="static/videos/video3.mp4" type="video/mp4">
                浏览器不支持MP4视频
            </video>
            <div class="speed-tip">2x 倍速</div>
            <div class="progress-wrap">
                <div class="progress-bar"></div>
            </div>
            <div class="douyin-info">
                <h3>@一叶知秋 · 广告拍摄</h3>
                <p>品牌宣传片段 #广告 #拍摄 #制作</p>
            </div>
        </div>
    </div>
    <div class="douyin-nav">
        <button class="douyin-nav-btn up" id="btn-up"><i class="fas fa-chevron-up"></i></button>
        <div class="douyin-dots" id="dot-wrap"></div>
        <button class="douyin-nav-btn down" id="btn-down"><i class="fas fa-chevron-down"></i></button>
    </div>
    <div class="douyin-hint">鼠标滚轮/手指上下滑动切换视频 · 长按视频2倍速 · 拖动进度条跳转</div>
</div>

<script>
const container = document.getElementById('douyin-container');
const slides = document.querySelectorAll('.douyin-slide');
const slideCount = slides.length;
let currentIndex = 0;
let touchStartY = 0;
let scrollLock = false;
const dotWrap = document.getElementById('dot-wrap');

// 长按倍速变量
let longPressTimer = null;
const LONG_PRESS_TIME = 150; // 长按150ms触发2倍速

// 生成圆点指示器
function createDots() {
    dotWrap.innerHTML = '';
    for(let i=0; i<slideCount; i++) {
        const span = document.createElement('span');
        span.dataset.index = i;
        if(i === currentIndex) span.classList.add('active');
        dotWrap.appendChild(span);
    }
}
createDots();

// 更新滑动位置、播放、进度条
function updateSlide() {
    container.style.transform = `translateY(-${currentIndex * 100}vh)`;
    document.querySelectorAll('.douyin-dots span').forEach(dot => {
        dot.classList.toggle('active', Number(dot.dataset.index) === currentIndex);
    })
    slides.forEach((slide, idx) => {
        const video = slide.querySelector('video');
        // 重置进度条
        slide.querySelector('.progress-bar').style.width = '0%';
        if(idx === currentIndex) {
            video.play();
            // 实时更新进度条
            video.ontimeupdate = () => {
                const percent = (video.currentTime / video.duration) * 100;
                slide.querySelector('.progress-bar').style.width = percent + '%';
            }
            // 进度条点击跳转
            const progressWrap = slide.querySelector('.progress-wrap');
            progressWrap.onclick = (e) => {
                const rect = progressWrap.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const totalWidth = rect.width;
                const jumpTime = (clickX / totalWidth) * video.duration;
                video.currentTime = jumpTime;
            }
        } else {
            video.pause();
        }
    })
}

// 切换上一条
function slideUp() {
    if(currentIndex > 0 && !scrollLock) {
        scrollLock = true;
        currentIndex--;
        updateSlide();
        setTimeout(()=>scrollLock=false,400);
    }
}
// 切换下一条
function slideDown() {
    if(currentIndex < slideCount - 1 && !scrollLock) {
        scrollLock = true;
        currentIndex++;
        updateSlide();
        setTimeout(()=>scrollLock=false,400);
    }
}

// PC鼠标滚轮滑动
container.addEventListener('wheel', (e)=>{
    e.preventDefault();
    if(scrollLock) return;
    e.deltaY > 0 ? slideDown() : slideUp();
})

// 手机触屏滑动 + 长按2倍速
container.addEventListener('touchstart', e => {
    touchStartY = e.touches[0].clientY;
    const slide = slides[currentIndex];
    const video = slide.querySelector('video');
    const speedTip = slide.querySelector('.speed-tip');
    // 开启长按计时器
    longPressTimer = setTimeout(() => {
        video.playbackRate = 2;
        speedTip.style.display = 'block';
    }, LONG_PRESS_TIME);
})
container.addEventListener('touchmove', e => {
    e.preventDefault();
    clearTimeout(longPressTimer);
})
container.addEventListener('touchend', e => {
    clearTimeout(longPressTimer);
    // 恢复1倍速，隐藏提示
    const slide = slides[currentIndex];
    const video = slide.querySelector('video');
    const speedTip = slide.querySelector('.speed-tip');
    video.playbackRate = 1;
    speedTip.style.display = 'none';

    const touchEndY = e.changedTouches[0].clientY;
    const diff = touchEndY - touchStartY;
    if(diff < -60) slideDown();
    if(diff > 60) slideUp();
})

// 上下箭头按钮点击
document.getElementById('btn-up').addEventListener('click', slideUp);
document.getElementById('btn-down').addEventListener('click', slideDown);

// 点击视频暂停播放
slides.forEach(slide => {
    const video = slide.querySelector('video');
    video.addEventListener('click', () => {
        video.paused ? video.play() : video.pause();
    })
})

// 关闭按钮
document.getElementById('douyin-close').addEventListener('click', () => {
    document.getElementById('douyin-modal').style.display = 'none';
    slides.forEach(s => s.querySelector('video').pause());
})

window.onload = updateSlide;
</script>
</body>
</html>
