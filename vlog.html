<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>动画作品 · 毛玻璃滑动</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            height: 100%;
            overflow: hidden;
            background: #0a0a0f;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        #douyin-modal {
            position: fixed;
            inset: 0;
            background: #0a0a0f;
            z-index: 9999;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            touch-action: none;
        }

        .douyin-container {
            width: 100%;
            height: 100vh;
            transition: transform 0.4s cubic-bezier(0.22, 0.68, 0.35, 1);
            will-change: transform;
            touch-action: none;
        }

        .douyin-slide {
            width: 100%;
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0f;
            touch-action: none;
            padding: 0 12px;
        }

        .glass-card {
            position: relative;
            width: 100%;
            max-height: 80vh;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px) saturate(1.2);
            -webkit-backdrop-filter: blur(12px) saturate(1.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            border: 0.5px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
            padding: 6px;
            transition: transform 0.25s ease, box-shadow 0.3s ease;
        }
        .glass-card:active {
            transform: scale(0.98);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
        }

        .douyin-video {
            width: 100%;
            height: auto;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 22px;
            display: block;
            background: #000;
            will-change: transform;
            pointer-events: auto;
            box-shadow: inset 0 2px 20px rgba(0,0,0,0.3);
        }

        .douyin-info {
            position: absolute;
            left: 24px;
            bottom: 110px;
            z-index: 15;
            pointer-events: none;
            background: rgba(10, 10, 15, 0.3);
            backdrop-filter: blur(16px) saturate(1.4);
            -webkit-backdrop-filter: blur(16px) saturate(1.4);
            padding: 10px 18px 12px 18px;
            border-radius: 24px;
            border: 0.5px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            max-width: 80%;
        }
        .douyin-info h3 {
            font-size: 17px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.3px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            margin-bottom: 2px;
        }
        .douyin-info p {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 300;
            letter-spacing: 0.2px;
        }

        /* ===== 进度条 ===== */
        .progress-wrap {
            position: absolute;
            bottom: 88px;
            left: 50%;
            transform: translateX(-50%);
            width: 88%;
            height: 6px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 20px;
            cursor: pointer;
            z-index: 15;
            touch-action: none;
            box-shadow: inset 0 1px 6px rgba(0,0,0,0.3);
            transition: height 0.2s ease, background 0.2s ease;
            padding: 8px 0;
            margin-top: -8px;
            background-clip: padding-box;
        }
        .progress-wrap::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 24px;
            background: transparent;
            pointer-events: none;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ffffff, #b0c8ff);
            border-radius: 20px;
            width: 0%;
            transition: width 0.08s ease-out;
            box-shadow: 0 0 20px rgba(150, 180, 255, 0.4);
            position: relative;
        }
        .progress-bar::after {
            content: '';
            position: absolute;
            right: -5px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5), 0 2px 8px rgba(0,0,0,0.3);
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .progress-wrap.dragging .progress-bar::after {
            opacity: 1;
        }
        .progress-wrap.dragging {
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
        }

        .progress-time-label {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.5px;
            background: rgba(10, 10, 15, 0.2);
            backdrop-filter: blur(12px) saturate(1.4);
            -webkit-backdrop-filter: blur(12px) saturate(1.4);
            padding: 3px 16px;
            border-radius: 30px;
            border: 0.5px solid rgba(255, 255, 255, 0.04);
            pointer-events: none;
            z-index: 16;
            opacity: 0.8;
            transition: opacity 0.3s;
            font-variant-numeric: tabular-nums;
        }
        .progress-wrap.dragging ~ .progress-time-label {
            opacity: 1;
            color: #fff;
            background: rgba(10, 10, 15, 0.4);
        }

        .douyin-hint {
            position: absolute;
            top: 56px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            background: rgba(10, 10, 15, 0.25);
            backdrop-filter: blur(18px) saturate(1.6);
            -webkit-backdrop-filter: blur(18px) saturate(1.6);
            padding: 6px 20px;
            border-radius: 40px;
            border: 0.5px solid rgba(255, 255, 255, 0.06);
            letter-spacing: 0.5px;
            font-weight: 300;
            white-space: nowrap;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        /* ===== 右上角 Vlog 按钮 (完全采用你提供的样式) ===== */
        .vlog-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 30;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #F4D758;
            color: #1a2a4a;
            padding: 10px 20px;
            border-radius: 60px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(244, 215, 88, 0.30);
            transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1),
                        box-shadow 0.3s cubic-bezier(0.2, 0, 0, 1);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
            position: absolute;
            overflow: hidden;
            letter-spacing: 0.3px;
        }

        /* 悬停效果 (桌面) */
        @media (hover: hover) {
            .vlog-btn:hover {
                transform: scale(1.05);
                box-shadow: 0 8px 28px rgba(244, 215, 88, 0.45);
                background: #f8df6e;
            }
        }

        /* 点击效果 (放大) */
        .vlog-btn:active {
            transform: scale(1.12);
            transition-duration: 0.08s;
            box-shadow: 0 4px 12px rgba(244, 215, 88, 0.25);
        }

        /* 点击涟漪 */
        .vlog-btn .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            transform: scale(0);
            animation: rippleAnim 0.5s cubic-bezier(0.2, 0, 0, 1) forwards;
            pointer-events: none;
            width: 100px;
            height: 100px;
            margin-left: -50px;
            margin-top: -50px;
            top: 50%;
            left: 50%;
        }

        @keyframes rippleAnim {
            0% {
                transform: scale(0);
                opacity: 0.8;
            }
            100% {
                transform: scale(3);
                opacity: 0;
            }
        }

        /* SVG 图标 */
        .vlog-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        /* 按钮文字 */
        .vlog-btn .btn-text {
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .douyin-nav {
            position: absolute;
            right: 18px;
            bottom: 30px;
            top: auto;
            transform: none;
            display: flex;
            flex-direction: row;
            gap: 14px;
            align-items: center;
            z-index: 30;
            background: rgba(10, 10, 15, 0.25);
            backdrop-filter: blur(22px) saturate(1.8);
            -webkit-backdrop-filter: blur(22px) saturate(1.8);
            padding: 6px 18px 6px 14px;
            border-radius: 40px;
            border: 0.5px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .douyin-nav-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 10px 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 40px;
            min-height: 40px;
            border-radius: 30px;
            transition: background 0.15s;
            touch-action: none;
        }
        .douyin-nav-btn:active {
            background: rgba(255, 255, 255, 0.06);
        }
        .nav-icon {
            fill: rgba(255, 255, 255, 0.7);
            width: 20px;
            height: 20px;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3));
        }

        .douyin-dots {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 0 4px;
        }
        .douyin-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: background 0.3s, transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 0 6px rgba(0,0,0,0.2);
        }
        .douyin-dots span.active {
            background: #fff;
            transform: scale(1.35);
            box-shadow: 0 0 18px rgba(180, 200, 255, 0.5);
        }

        .speed-tip {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 26px;
            font-weight: 500;
            background: rgba(10, 10, 15, 0.3);
            backdrop-filter: blur(30px) saturate(1.8);
            -webkit-backdrop-filter: blur(30px) saturate(1.8);
            padding: 12px 32px;
            border-radius: 60px;
            display: none;
            z-index: 40;
            letter-spacing: 2px;
            border: 0.5px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
            text-shadow: 0 2px 20px rgba(0,0,0,0.4);
        }

        @media (min-width: 1024px) {
            .douyin-slide { padding: 0 40px; }
            .glass-card { max-height: 85vh; }
            .douyin-video { max-height: 85vh; }
            .douyin-hint { bottom: 30px; top: auto; }
            .douyin-nav { right: 30px; bottom: 40px; }
            .douyin-info { bottom: 130px; }
            .progress-wrap { bottom: 100px; }
            .progress-time-label { bottom: 112px; }
            .vlog-btn { top: 24px; right: 24px; padding: 12px 24px; font-size: 16px; }
            .vlog-btn svg { width: 22px; height: 22px; }
        }

        @media (max-width: 480px) {
            .douyin-info { left: 16px; bottom: 100px; padding: 8px 14px; }
            .douyin-info h3 { font-size: 15px; }
            .douyin-info p { font-size: 11px; }
            .douyin-hint { font-size: 10px; padding: 4px 14px; top: 48px; }
            .progress-wrap { bottom: 78px; width: 92%; }
            .progress-time-label { bottom: 90px; font-size: 11px; padding: 2px 12px; }
            .douyin-nav { padding: 4px 12px 4px 8px; gap: 10px; bottom: 24px; right: 12px; }
            .douyin-dots span { width: 6px; height: 6px; gap: 10px; }
            .nav-icon { width: 18px; height: 18px; }
            .vlog-btn { top: 12px; right: 12px; padding: 8px 14px; font-size: 12px; gap: 6px; }
            .vlog-btn svg { width: 16px; height: 16px; }
        }
    </style>
</head>
<body>
<div id="douyin-modal">
    <!-- ===== 右上角 Vlog 按钮 (完全采用你提供的样式) ===== -->
    <a href="https://yztcf.de5.net/vlog2.html" target="_blank" class="vlog-btn" id="vlogBtn">
        <!-- 播放图标 -->
        <svg viewBox="0 0 24 24">
            <polygon points="23 7 16 12 23 17 23 7"/>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
        </svg>
        <span class="btn-text">Vlog / 详情</span>
    </a>

    <div class="douyin-hint">⬆️ 滑动切换 · 长按 2x 倍速</div>
    <div class="douyin-container" id="douyin-container">
        <div class="douyin-slide" data-index="0">
            <div class="glass-card">

                <div class="progress-bar" id="progress-bar-0"></div>
            </div>
            <div class="progress-time-label" id="time-label-0">00:00 / 00:00</div>
            <div class="douyin-info"><h3>@一叶知秋 · 3D动画</h3><p>科幻城市 · C4D</p></div>
        </div>
        <div class="douyin-slide" data-index="1">
            <div class="glass-card">
                <video class="douyin-video" loop playsinline webkit-playsinline preload="auto" muted autoplay>
                    <source src="static/videos/video2.mp4" type="video/mp4">
                </video>
            </div>
            <div class="speed-tip">2x 倍速</div>
            <div class="progress-wrap" id="progress-wrap-1">
                <div class="progress-bar" id="progress-bar-1"></div>
            </div>
            <div class="progress-time-label" id="time-label-1">00:00 / 00:00</div>
            <div class="douyin-info"><h3>@一叶知秋 · 创意短片</h3><p>色彩节奏 · 剪辑</p></div>
        </div>
        <div class="douyin-slide" data-index="2">
            <div class="glass-card">
                <video class="douyin-video" loop playsinline webkit-playsinline preload="auto" muted autoplay>
                    <source src="static/videos/video3.mp4" type="video/mp4">
                </video>
            </div>
            <div class="speed-tip">2x 倍速</div>
            <div class="progress-wrap" id="progress-wrap-2">
                <div class="progress-bar" id="progress-bar-2"></div>
            </div>
            <div class="progress-time-label" id="time-label-2">00:00 / 00:00</div>
            <div class="douyin-info"><h3>@一叶知秋 · 广告拍摄</h3><p>品牌宣传 · 制作</p></div>
        </div>
    </div>
    <div class="douyin-nav">
        <button class="douyin-nav-btn up" id="btn-up" aria-label="上一个">
            <svg class="nav-icon" viewBox="0 0 320 512"><path d="M182.6 137.4c-12.5-12.5-32.8-12.5-45.3 0l-128 128c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L160 205.3l105.4 105.4c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3l-128-128z"/></svg>
        </button>
        <div class="douyin-dots" id="dot-wrap"></div>
        <button class="douyin-nav-btn down" id="btn-down" aria-label="下一个">
            <svg class="nav-icon" viewBox="0 0 320 512"><path d="M137.4 374.6c12.5 12.5 32.8 12.5 45.3 0l128-128c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L160 306.7 54.6 201.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l128 128z"/></svg>
        </button>
    </div>
</div>

<script>
    (function() {
        const container = document.getElementById('douyin-container');
        const slides = document.querySelectorAll('.douyin-slide');
        const slideCount = slides.length;
        let currentIndex = 0;
        let touchStartY = 0;
        let touchMoveY = 0;
        let scrollLock = false;
        const dotWrap = document.getElementById('dot-wrap');
        let longPressTimer = null;
        const LONG_PRESS_MS = 170;
        let isLongPress = false;
        let isTouching = false;

        // ============================================
        // Vlog 按钮点击涟漪效果 (完全采用你提供的脚本)
        // ============================================
        (function() {
            const btn = document.getElementById('vlogBtn');
            if (!btn) return;

            function createRipple(e) {
                const rect = btn.getBoundingClientRect();
                const oldRipple = btn.querySelector('.ripple');
                if (oldRipple) oldRipple.remove();

                const ripple = document.createElement('span');
                ripple.className = 'ripple';

                let clientX, clientY;
                if (e.type === 'touchstart') {
                    const touch = e.touches[0];
                    clientX = touch.clientX;
                    clientY = touch.clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }

                const x = clientX - rect.left;
                const y = clientY - rect.top;

                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';

                btn.appendChild(ripple);

                setTimeout(() => {
                    if (ripple.parentNode) ripple.remove();
                }, 500);
            }

            btn.addEventListener('touchstart', function(e) {
                createRipple(e);
            }, { passive: true });

            btn.addEventListener('mousedown', function(e) {
                createRipple(e);
            });

            btn.addEventListener('selectstart', function(e) {
                e.preventDefault();
            });
        })();

        // ---- 进度条拖动 ----
        let isDragging = false;
        let dragVideo = null;
        let dragProgressWrap = null;
        let dragProgressBar = null;
        let dragTimeLabel = null;
        let dragDuration = 1;

        function formatTime(seconds) {
            if (!seconds || isNaN(seconds) || !isFinite(seconds)) return '00:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function updateTimeLabel(video, label) {
            if (!video || !label) return;
            const current = formatTime(video.currentTime || 0);
            const total = formatTime(video.duration || 0);
            label.textContent = `${current} / ${total}`;
        }

        function updateProgressByClientX(clientX, wrap, video) {
            const rect = wrap.getBoundingClientRect();
            let ratio = (clientX - rect.left) / rect.width;
            ratio = Math.min(Math.max(ratio, 0), 1);
            const bar = wrap.querySelector('.progress-bar');
            if (bar) bar.style.width = (ratio * 100) + '%';
            return ratio;
        }

        function initProgressForSlide(slide) {
            const wrap = slide.querySelector('.progress-wrap');
            const bar = slide.querySelector('.progress-bar');
            const label = slide.querySelector('.progress-time-label');
            const video = slide.querySelector('video');

            if (!wrap || !bar || !video) return;

            const newWrap = wrap.cloneNode(true);
            wrap.parentNode.replaceChild(newWrap, wrap);
            const newBar = newWrap.querySelector('.progress-bar');

            const onStart = (e) => {
                if (slide.dataset.index != currentIndex) return;
                const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
                isDragging = true;
                dragVideo = video;
                dragProgressWrap = newWrap;
                dragProgressBar = newBar;
                dragTimeLabel = label;
                dragDuration = video.duration || 1;
                newWrap.classList.add('dragging');

                const rect = newWrap.getBoundingClientRect();
                let ratio = (clientX - rect.left) / rect.width;
                ratio = Math.min(Math.max(ratio, 0), 1);
                newBar.style.width = (ratio * 100) + '%';
                if (label) {
                    const time = ratio * dragDuration;
                    label.textContent = `${formatTime(time)} / ${formatTime(dragDuration)}`;
                }
                video.pause();
                e.preventDefault();
            };

            const onMove = (e) => {
                if (!isDragging || dragVideo !== video) return;
                const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
                const ratio = updateProgressByClientX(clientX, newWrap, video);
                if (label) {
                    const time = ratio * dragDuration;
                    label.textContent = `${formatTime(time)} / ${formatTime(dragDuration)}`;
                }
                e.preventDefault();
            };

            const onEnd = (e) => {
                if (!isDragging || dragVideo !== video) return;
                isDragging = false;
                newWrap.classList.remove('dragging');

                const rect = newWrap.getBoundingClientRect();
                const clientX = e.type === 'touchend' ? (e.changedTouches ? e.changedTouches[0].clientX : 0) : e.clientX;
                let ratio = (clientX - rect.left) / rect.width;
                ratio = Math.min(Math.max(ratio, 0), 1);
                if (video.duration) {
                    video.currentTime = ratio * video.duration;
                }
                if (label) {
                    updateTimeLabel(video, label);
                }
                video.play().catch(() => {});
                dragVideo = null;
                dragProgressWrap = null;
                dragProgressBar = null;
                dragTimeLabel = null;
                e.preventDefault();
            };

            newWrap.addEventListener('touchstart', onStart, { passive: false });
            newWrap.addEventListener('touchmove', onMove, { passive: false });
            newWrap.addEventListener('touchend', onEnd, { passive: false });
            newWrap.addEventListener('touchcancel', onEnd, { passive: false });

            newWrap.addEventListener('mousedown', onStart);
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);

            slide._progressCleanup = () => {
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onEnd);
            };
        }

        slides.forEach(s => initProgressForSlide(s));

        function createDots() {
            dotWrap.innerHTML = '';
            for (let i = 0; i < slideCount; i++) {
                const span = document.createElement('span');
                span.dataset.index = i;
                if (i === currentIndex) span.classList.add('active');
                dotWrap.appendChild(span);
            }
        }
        createDots();

        function updateSlide(animate = true) {
            container.style.transition = animate ? 'transform 0.4s cubic-bezier(0.22, 0.68, 0.35, 1)' : 'none';
            container.style.transform = `translateY(-${currentIndex * 100}vh)`;

            document.querySelectorAll('.douyin-dots span').forEach(dot => {
                const idx = Number(dot.dataset.index);
                dot.classList.toggle('active', idx === currentIndex);
            });

            slides.forEach((slide, idx) => {
                const video = slide.querySelector('video');
                const bar = slide.querySelector('.progress-bar');
                const label = slide.querySelector('.progress-time-label');

                if (idx === currentIndex) {
                    if (!isDragging) {
                        const playPromise = video.play();
                        if (playPromise !== undefined) playPromise.catch(() => {});
                        video.ontimeupdate = () => {
                            if (video.duration && !isDragging) {
                                const percent = (video.currentTime / video.duration) * 100;
                                if (bar) bar.style.width = Math.min(percent, 100) + '%';
                                if (label) updateTimeLabel(video, label);
                            }
                        };
                        if (label) updateTimeLabel(video, label);
                    }
                } else {
                    video.pause();
                    video.ontimeupdate = null;
                }
            });

            if (!animate) {
                requestAnimationFrame(() => {
                    container.style.transition = 'transform 0.4s cubic-bezier(0.22, 0.68, 0.35, 1)';
                });
            }
        }

        function slideUp() {
            if (currentIndex > 0 && !scrollLock && !isDragging) {
                scrollLock = true;
                currentIndex--;
                updateSlide(true);
                setTimeout(() => { scrollLock = false; }, 420);
            }
        }
        function slideDown() {
            if (currentIndex < slideCount - 1 && !scrollLock && !isDragging) {
                scrollLock = true;
                currentIndex++;
                updateSlide(true);
                setTimeout(() => { scrollLock = false; }, 420);
            }
        }

        let wheelLock = false;
        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (scrollLock || wheelLock || isDragging) return;
            wheelLock = true;
            e.deltaY > 0 ? slideDown() : slideUp();
            setTimeout(() => { wheelLock = false; }, 450);
        }, { passive: false });

        container.addEventListener('touchstart', (e) => {
            if (isDragging) return;
            const touch = e.touches[0];
            if (!touch) return;
            touchStartY = touch.clientY;
            touchMoveY = touchStartY;
            isTouching = true;
            isLongPress = false;
            clearTimeout(longPressTimer);

            const slide = slides[currentIndex];
            const video = slide.querySelector('video');
            const speedTip = slide.querySelector('.speed-tip');

            longPressTimer = setTimeout(() => {
                if (isTouching && Math.abs(touchMoveY - touchStartY) < 12) {
                    isLongPress = true;
                    video.playbackRate = 2.0;
                    speedTip.style.display = 'block';
                    if (navigator.vibrate) navigator.vibrate(10);
                }
            }, LONG_PRESS_MS);
        }, { passive: true });

        container.addEventListener('touchmove', (e) => {
            if (isDragging) return;
            const touch = e.touches[0];
            if (!touch || !isTouching) return;
            touchMoveY = touch.clientY;
            const delta = touchMoveY - touchStartY;

            if (Math.abs(delta) > 10) {
                clearTimeout(longPressTimer);
                const slide = slides[currentIndex];
                const video = slide.querySelector('video');
                if (video.playbackRate !== 1) {
                    video.playbackRate = 1;
                    slide.querySelector('.speed-tip').style.display = 'none';
                }
                isLongPress = false;
            }
            e.preventDefault();
        }, { passive: false });

        container.addEventListener('touchend', (e) => {
            if (isDragging) return;
            clearTimeout(longPressTimer);
            isTouching = false;
            const slide = slides[currentIndex];
            const video = slide.querySelector('video');
            const speedTip = slide.querySelector('.speed-tip');

            if (isLongPress || video.playbackRate !== 1) {
                video.playbackRate = 1;
                speedTip.style.display = 'none';
                isLongPress = false;
            }

            const delta = touchMoveY - touchStartY;
            if (Math.abs(delta) > 40 && !isLongPress && !scrollLock) {
                if (delta < 0) slideDown();
                else slideUp();
            }
            touchStartY = 0;
            touchMoveY = 0;
        }, { passive: true });

        container.addEventListener('touchcancel', () => {
            clearTimeout(longPressTimer);
            isTouching = false;
            const slide = slides[currentIndex];
            const video = slide.querySelector('video');
            video.playbackRate = 1;
            slide.querySelector('.speed-tip').style.display = 'none';
            isLongPress = false;
        }, { passive: true });

        document.getElementById('btn-up').addEventListener('click', (e) => { e.stopPropagation(); slideUp(); });
        document.getElementById('btn-down').addEventListener('click', (e) => { e.stopPropagation(); slideDown(); });

        slides.forEach(slide => {
            const video = slide.querySelector('video');
            video.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isDragging) return;
                video.paused ? video.play().catch(()=>{}) : video.pause();
            });
        });

        updateSlide(false);
        setTimeout(() => {
            container.style.transition = 'transform 0.4s cubic-bezier(0.22, 0.68, 0.35, 1)';
        }, 30);

        document.addEventListener('dblclick', (e) => e.preventDefault());

        window.addEventListener('beforeunload', () => {
            slides.forEach(s => { if (s._progressCleanup) s._progressCleanup(); });
        });
    })();
</script>
</body>
</html>
