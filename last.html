<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>深莞 · 销售智脑</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: #f0f2f7;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .app {
            max-width: 480px;
            width: 100%;
            height: 100%;
            max-height: 860px;
            background: #f0f2f7;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0, 10, 30, 0.10);
            position: relative;
        }

        /* ===== 头部 ===== */
        .app-header {
            flex-shrink: 0;
            padding: 14px 16px 6px;
            background: #f0f2f7;
            z-index: 10;
        }

        .header-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .header-row h1 {
            font-size: 18px;
            font-weight: 700;
            color: #0b1b33;
            flex-shrink: 0;
        }

        .icon-switch {
            display: flex;
            background: #ffffff;
            border-radius: 30px;
            padding: 3px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            flex-shrink: 0;
        }
        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 30px;
            border: none;
            background: transparent;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn.active {
            background: #1a3a6b;
            box-shadow: 0 2px 8px rgba(30, 60, 120, 0.2);
        }
        .icon-btn:active {
            transform: scale(0.92);
        }

        .header-row .date-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #ffffff;
            padding: 4px 12px 4px 10px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 500;
            color: #1f3f6e;
            border: 1px solid #e6eaf2;
            margin-left: auto;
            flex-shrink: 0;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
        }

        /* ===== 统计卡片 ===== */
        .stats-section {
            flex-shrink: 0;
            padding: 0 0 4px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            padding: 7px 2px;
            text-align: center;
            min-height: 52px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .stat-item:nth-child(1) {
            background: linear-gradient(135deg, #1a3a6b, #2d5aa0);
            color: white;
        }
        .stat-item:nth-child(2) {
            background: linear-gradient(135deg, #0f7b4a, #1a9e6a);
            color: white;
        }
        .stat-item:nth-child(3) {
            background: linear-gradient(135deg, #a0302a, #c94038);
            color: white;
        }
        .stat-item:nth-child(4) {
            background: linear-gradient(135deg, #b8782a, #d4993a);
            color: white;
        }
        .stat-item .label {
            font-size: 8px;
            font-weight: 500;
            opacity: 0.85;
            letter-spacing: 0.2px;
            text-transform: uppercase;
        }
        .stat-item .value {
            font-size: 17px;
            font-weight: 700;
            line-height: 1.2;
            margin-top: 1px;
            color: white;
        }
        .stat-item .trend-up {
            color: #8effb2;
        }
        .stat-item .trend-down {
            color: #ffb0a0;
        }

        /* ===== 搜索+Tab ===== */
        .search-section {
            flex-shrink: 0;
            padding: 0 0 4px;
        }
        .search-bar {
            background: #ffffff;
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 11px;
            color: #334e77;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #e6eaf2;
        }
        .search-bar span {
            opacity: 0.5;
        }
        .tab-group {
            display: flex;
            gap: 4px;
            background: #ffffff;
            border-radius: 40px;
            padding: 3px;
            margin-top: 6px;
            border: 1px solid #e6eaf2;
        }
        .tab-item {
            flex: 1;
            text-align: center;
            padding: 4px 0;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 500;
            color: #4b6589;
            border: none;
            background: transparent;
            cursor: default;
        }
        .tab-item.active {
            background: #1a3a6b;
            color: white;
            font-weight: 600;
        }

        /* ===== 滚动内容 ===== */
        .scroll-content {
            flex: 1;
            overflow-y: auto;
            padding: 0 14px 10px;
            -webkit-overflow-scrolling: touch;
        }
        .scroll-content::-webkit-scrollbar {
            width: 3px;
        }
        .scroll-content::-webkit-scrollbar-thumb {
            background: #c0c8d8;
            border-radius: 10px;
        }

        /* ===== 双栏 ===== */
        .row-two {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }
        .col-half {
            flex: 1;
            background: #ffffff;
            border-radius: 16px;
            padding: 10px 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
            min-width: 0;
            overflow: hidden;
        }
        .mod-title {
            font-size: 11px;
            font-weight: 600;
            color: #14273e;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
        }
        .mod-title::before {
            content: "";
            width: 3px;
            height: 12px;
            background: #2d7aff;
            border-radius: 4px;
            margin-right: 5px;
        }

        .info-line {
            display: flex;
            justify-content: space-between;
            padding: 4px 6px;
            align-items: center;
            border-radius: 6px;
            margin-bottom: 2px;
            background: #f8faff;
            border: 1px solid #eef2f9;
        }
        .info-line:last-child {
            margin-bottom: 0;
        }
        .info-tag {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 500;
            color: #1d314a;
        }
        .info-tag .icon {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            flex-shrink: 0;
        }
        .icon-star {
            background: #fff3d6;
            color: #d68b1a;
        }
        .icon-yen {
            background: #e3edff;
            color: #2d6ef0;
        }
        .icon-people {
            background: #e1ecfe;
            color: #2d6ef0;
        }
        .icon-up {
            background: #dcf9e7;
            color: #0f9d58;
        }
        .icon-down {
            background: #ffe8e3;
            color: #e74c3c;
        }
        .info-line .value-text {
            font-weight: 600;
            color: #0b1b33;
            font-size: 12px;
        }

        /* ===== 饼图 ===== */
        .pie-box {
            height: 78px;
            width: 100%;
            margin: 0 auto 1px;
        }
        .pie-legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0px 4px;
            font-size: 9px;
            color: #1b334f;
            margin-top: 2px;
        }
        .legend-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 3px;
            margin-right: 3px;
            vertical-align: middle;
        }

        /* ===== 排行 ===== */
        .rank-wrap {
            background: #ffffff;
            border-radius: 16px;
            padding: 10px 10px 2px;
            margin-top: 6px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
        }
        .rank-wrap .mod-title {
            font-size: 11px;
            margin-bottom: 0;
        }
        .rank-wrap .mod-title span {
            font-size: 10px;
            color: #6a7f9e;
            font-weight: 400;
        }
        .filter-group {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding: 3px 0 6px;
            scrollbar-width: none;
            white-space: nowrap;
        }
        .filter-group::-webkit-scrollbar {
            display: none;
        }
        .filter-btn {
            padding: 3px 10px;
            border-radius: 30px;
            border: 1px solid #e2e8f2;
            font-size: 10px;
            font-weight: 500;
            color: #3b5780;
            background: transparent;
            flex-shrink: 0;
            cursor: pointer;
        }
        .filter-btn.active {
            background: #1a3a6b;
            color: white;
            border-color: #1a3a6b;
        }
        .filter-btn:active {
            transform: scale(0.94);
        }

        .rank-header {
            display: grid;
            grid-template-columns: 20px 1fr 38px 34px 34px;
            font-size: 9px;
            color: #697f9e;
            padding: 2px 0 5px;
            border-bottom: 1px solid #edf2f9;
        }
        .rank-item {
            display: grid;
            grid-template-columns: 20px 1fr 38px 34px 34px;
            padding: 5px 0;
            align-items: center;
            border-bottom: 1px solid #f2f6fd;
            font-size: 11px;
        }
        .rank-item:last-child {
            border-bottom: none;
        }
        .rank-num {
            width: 18px;
            height: 18px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 9px;
            color: white;
            background: #b6c6e0;
        }
        .rank-num.gold {
            background: #f5b342;
        }
        .rank-num.silver {
            background: #b0bcca;
        }
        .rank-num.bronze {
            background: #dba16a;
        }
        .cate-tag {
            font-size: 7px;
            background: #eef3fc;
            padding: 1px 5px;
            border-radius: 30px;
            color: #3a5b84;
            display: inline-block;
            margin-top: 1px;
        }
        .text-new {
            color: #e74c3c;
            font-weight: 600;
            font-size: 10px;
        }
        .text-muted {
            color: #6f87aa;
            font-size: 9px;
        }
        .fw-600 {
            font-weight: 600;
        }

        /* ===== AI复盘页 ===== */
        .ai-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
        }
        .ai-card h3 {
            font-size: 13px;
            color: #0b1b33;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .ai-card h3 .badge {
            font-size: 9px;
            background: #1a3a6b;
            color: white;
            padding: 1px 10px;
            border-radius: 30px;
            font-weight: 400;
        }
        .ai-card p,
        .ai-card li {
            font-size: 12px;
            color: #1d314a;
            line-height: 1.6;
        }
        .ai-card ul {
            padding-left: 18px;
            margin: 4px 0;
        }
        .ai-card .highlight-box {
            background: #f0f7ff;
            border-left: 3px solid #2d7aff;
            padding: 8px 12px;
            border-radius: 6px;
            margin: 6px 0;
            font-size: 12px;
        }

        .ai-input-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .ai-input-row input {
            flex: 1;
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid #e2e8f2;
            font-size: 12px;
            outline: none;
            background: #f8faff;
        }
        .ai-input-row input:focus {
            border-color: #2d7aff;
        }
        .ai-input-row button {
            padding: 8px 18px;
            border-radius: 30px;
            border: none;
            background: #1a3a6b;
            color: white;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }
        .ai-input-row button:active {
            transform: scale(0.95);
        }
        .ai-input-row button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .ai-response {
            background: #f8faff;
            border-radius: 12px;
            padding: 12px;
            margin-top: 10px;
            font-size: 12px;
            line-height: 1.7;
            color: #1d314a;
            white-space: pre-wrap;
            max-height: 260px;
            overflow-y: auto;
            border: 1px solid #eef2f9;
        }
        .ai-response .loading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #6a7f9e;
        }
        .ai-response .loading::after {
            content: '';
            width: 14px;
            height: 14px;
            border: 2px solid #e2e8f2;
            border-top-color: #1a3a6b;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .quick-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 8px 0 4px;
        }
        .quick-actions button {
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid #dde1ec;
            background: white;
            font-size: 10px;
            color: #3b5780;
            cursor: pointer;
        }
        .quick-actions button:active {
            transform: scale(0.94);
        }

        /* ===== 页面切换 ===== */
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }

        /* ===== 密钥输入 ===== */
        .key-setup {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-top: 4px;
            padding: 4px 8px;
            background: #fff8e6;
            border-radius: 30px;
            border: 1px solid #f0dca0;
        }
        .key-setup input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 10px;
            color: #6a5d3a;
            outline: none;
            padding: 4px 0;
        }
        .key-setup input::placeholder {
            color: #b8a87a;
        }
        .key-setup button {
            background: #b8782a;
            border: none;
            color: white;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
        }
        .key-setup .status {
            font-size: 9px;
            color: #0f7b4a;
        }

        /* ===== 小屏适配 ===== */
        @media (max-width: 420px) {
            body {
                padding: 4px;
            }
            .app {
                max-height: 820px;
                border-radius: 20px;
            }
            .app-header {
                padding: 10px 12px 4px;
            }
            .header-row h1 {
                font-size: 16px;
            }
            .icon-btn {
                width: 30px;
                height: 30px;
                font-size: 14px;
            }
            .header-row .date-selector {
                font-size: 10px;
                padding: 3px 8px;
            }
            .stat-item .value {
                font-size: 15px;
            }
            .stat-item {
                min-height: 44px;
                padding: 5px 2px;
            }
            .stat-item .label {
                font-size: 7px;
            }
            .search-bar {
                font-size: 10px;
                padding: 5px 12px;
            }
            .tab-item {
                font-size: 10px;
                padding: 3px 0;
            }
            .scroll-content {
                padding: 0 10px 6px;
            }
            .col-half {
                padding: 8px 6px;
            }
            .mod-title {
                font-size: 10px;
            }
            .info-line {
                padding: 3px 4px;
            }
            .info-tag {
                font-size: 10px;
            }
            .info-tag .icon {
                width: 16px;
                height: 16px;
                font-size: 8px;
            }
            .info-line .value-text {
                font-size: 11px;
            }
            .pie-box {
                height: 68px;
            }
            .pie-legend {
                font-size: 8px;
            }
            .rank-wrap {
                padding: 8px 8px 2px;
            }
            .rank-header {
                font-size: 8px;
                grid-template-columns: 18px 1fr 32px 28px 28px;
            }
            .rank-item {
                font-size: 10px;
                grid-template-columns: 18px 1fr 32px 28px 28px;
                padding: 4px 0;
            }
            .rank-num {
                width: 16px;
                height: 16px;
                font-size: 8px;
            }
            .filter-btn {
                font-size: 9px;
                padding: 2px 8px;
            }
            .ai-card {
                padding: 10px;
            }
            .ai-card h3 {
                font-size: 12px;
            }
            .ai-card p,
            .ai-card li {
                font-size: 11px;
            }
            .ai-input-row input {
                font-size: 11px;
                padding: 6px 12px;
            }
            .ai-input-row button {
                font-size: 11px;
                padding: 6px 14px;
            }
            .ai-response {
                font-size: 11px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="app">

        <!-- ===== 头部 ===== -->
        <div class="app-header">
            <div class="header-row">
                <h1 id="pageTitle">深莞 · 销售智脑</h1>
                <div class="icon-switch">
                    <button class="icon-btn active" data-page="page-turnover" id="iconMoney">💰</button>
                    <button class="icon-btn" data-page="page-sale" id="iconBox">📦</button>
                    <button class="icon-btn" data-page="page-ai" id="iconAI">🧠</button>
                </div>
                <div class="date-selector">📅 2026/08/03</div>
            </div>

            <!-- 密钥输入 -->
            <div class="key-setup" id="keySetup">
                <span style="font-size:10px;">🔑</span>
                <input type="password" id="apiKeyInput" placeholder="输入 Agnes API Key..." value="">
                <button id="saveKeyBtn">保存</button>
                <span class="status" id="keyStatus">⚪ 未配置</span>
            </div>

            <!-- 统计卡片 -->
            <div class="stats-section" id="statsContainer"></div>

            <!-- 搜索+Tab -->
            <div class="search-section">
                <div class="search-bar"><span>🔍</span> 输入商品名或条码，查看逐笔销售明细</div>
                <div class="tab-group">
                    <button class="tab-item">今日</button>
                    <button class="tab-item">周期</button>
                    <button class="tab-item active">本月</button>
                </div>
            </div>
        </div>

        <!-- ===== 滚动内容 ===== -->
        <div class="scroll-content" id="scrollContent"></div>

    </div>

    <script>
        (function() {
            // ============================================================
            // 1. 数据定义
            // ============================================================
            const data = {
                turnover: {
                    title: '💰 营业额',
                    stats: [
                        { label: '本月营业额', value: '¥4566' },
                        { label: '本月累计', value: '¥4566' },
                        { label: '较昨日', value: '-¥71', cls: 'trend-down' },
                        { label: '客单价', value: '¥14' }
                    ],
                    infoLines: [
                        { icon: '★', iconCls: 'icon-star', label: '成交商品', value: '264种' },
                        { icon: '¥', iconCls: 'icon-yen', label: '客单价', value: '¥15' },
                        { icon: '👤', iconCls: 'icon-people', label: '到店人数', value: '311人' }
                    ],
                    pieData: [36, 26, 16, 9, 8, 4],
                    pieLabels: ['烟草', '饮料', '日用品', '零食', '槟榔', '其他'],
                    pieColors: ['#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6', '#95a5a6'],
                    pieLegend: [
                        { label: '烟草', pct: '36%', color: '#e74c3c' },
                        { label: '饮料', pct: '26%', color: '#3498db' },
                        { label: '日用品', pct: '16%', color: '#2ecc71' },
                        { label: '零食', pct: '9%', color: '#f39c12' },
                        { label: '槟榔', pct: '8%', color: '#9b59b6' },
                        { label: '其他', pct: '4%', color: '#95a5a6' }
                    ],
                    rankTitle: '商品营业额排行',
                    rankCount: '共264种',
                    filters: ['全部 264', '烟草 31', '饮料 90', '日用品 28', '零食 83'],
                    headers: ['排名', '商品名称', '金额', '件数', ''],
                    rows: [
                        { rank: '1', rankCls: 'gold', name: '农村土鸡蛋（斤）', cat: '日用品', col1: '¥254',
                        col2: '26件' },
                        { rank: '2', rankCls: 'silver', name: '振南晚香优米', cat: '日用品', col1: '¥220',
                        col2: '2件' },
                        { rank: '3', rankCls: 'bronze', name: '黄鹤楼（硬峡谷柔情）', cat: '烟草', col1: '¥210',
                            col2: '6件' },
                        { rank: '4', rankCls: 'silver', name: '芙蓉王', cat: '烟草', col1: '¥200', col2: '8件' },
                        { rank: '5', rankCls: 'silver', name: '红利群', cat: '烟草', col1: '¥162', col2: '9件' },
                        { rank: '6', rankCls: 'silver', name: '槟榔（口味王）', cat: '槟榔', col1: '¥125',
                        col2: '5件' }
                    ],
                    hasCol4: false
                },
                sale: {
                    title: '📦 售出商品数',
                    stats: [
                        { label: '本月售出', value: '677件' },
                        { label: '本月累计', value: '677件' },
                        { label: '较昨日', value: '+41', cls: 'trend-up' },
                        { label: '本月日均', value: '226件' }
                    ],
                    infoLines: [
                        { icon: '★', iconCls: 'icon-star', label: '畅销商品', value: '3种' },
                        { icon: '↑', iconCls: 'icon-up', label: '销量上涨', value: '264' },
                        { icon: '↓', iconCls: 'icon-down', label: '销量下降', value: '0' }
                    ],
                    pieData: [34, 26, 14, 13, 8, 3],
                    pieLabels: ['饮料', '零食', '日用品', '烟草', '冰淇淋', '槟榔'],
                    pieColors: ['#3498db', '#f39c12', '#2ecc71', '#e74c3c', '#9b59b6', '#1abc9c'],
                    pieLegend: [
                        { label: '饮料', pct: '34%', color: '#3498db' },
                        { label: '零食', pct: '26%', color: '#f39c12' },
                        { label: '日用品', pct: '14%', color: '#2ecc71' },
                        { label: '烟草', pct: '13%', color: '#e74c3c' },
                        { label: '冰淇淋', pct: '8%', color: '#9b59b6' },
                        { label: '槟榔', pct: '3%', color: '#1abc9c' }
                    ],
                    rankTitle: '商品销量排行',
                    rankCount: '共264种',
                    filters: ['全部 264', '饮料 90', '零食 83', '日用品 28', '烟草 31'],
                    headers: ['排名', '商品名称', '当月', '本月', '变化'],
                    rows: [
                        { rank: '1', rankCls: 'gold', name: '打印（黑）', cat: '日用品', col1: '31', col2: '31',
                            col3: '新增', col3Cls: 'text-new' },
                        { rank: '2', rankCls: 'silver', name: '农村土鸡蛋（斤）', cat: '日用品', col1: '26', col2: '26',
                            col3: '新增', col3Cls: 'text-new' },
                        { rank: '3', rankCls: 'bronze', name: '东鹏500ml维生素功能饮（商）', cat: '饮料', col1: '16',
                            col2: '16', col3: '新增', col3Cls: 'text-new' },
                        { rank: '4', rankCls: 'silver', name: '雪花清爽啤酒', cat: '饮料', col1: '13', col2: '13',
                            col3: '新增', col3Cls: 'text-new' }
                    ],
                    hasCol4: true
                }
            };

            // ============================================================
            // 2. 状态
            // ============================================================
            let currentPage = 'turnover';
            window.apiKey = localStorage.getItem('agnes_api_key') || '';
            let isAILoading = false;

            // ============================================================
            // 3. DOM
            // ============================================================
            const statsContainer = document.getElementById('statsContainer');
            const scrollContent = document.getElementById('scrollContent');
            const pageTitle = document.getElementById('pageTitle');
            const iconMoney = document.getElementById('iconMoney');
            const iconBox = document.getElementById('iconBox');
            const iconAI = document.getElementById('iconAI');
            const apiKeyInput = document.getElementById('apiKeyInput');
            const saveKeyBtn = document.getElementById('saveKeyBtn');
            const keyStatus = document.getElementById('keyStatus');

            // ============================================================
            // 4. 密钥管理
            // ============================================================
            if (apiKey) {
                apiKeyInput.value = apiKey;
                keyStatus.textContent = '✅ 已配置';
                keyStatus.style.color = '#0f7b4a';
            }
saveKeyBtn.addEventListener('click', function() {
    const key = apiKeyInput.value.trim();
    if (key) {
        localStorage.setItem('agnes_api_key', key);
        window.apiKey = key;
        keyStatus.textContent = '✅ 已保存';
        keyStatus.style.color = '#0f7b4a';
    } else {
        localStorage.removeItem('agnes_api_key');
        window.apiKey = '';
        keyStatus.textContent = '⚪ 未配置';
        keyStatus.style.color = '#6a7f9e';
    }
});

            // ============================================================
            // 5. 渲染函数
            // ============================================================
            function renderPage(pageKey) {
                if (pageKey === 'ai') {
                    renderAIPage();
                    return;
                }
                const d = data[pageKey];
                if (!d) return;

                pageTitle.textContent = d.title;
                iconMoney.classList.toggle('active', pageKey === 'turnover');
                iconBox.classList.toggle('active', pageKey === 'sale');
                iconAI.classList.remove('active');

                // 统计卡片
                statsContainer.innerHTML = `
                    <div class="stats-grid">
                        ${d.stats.map(s => `
                            <div class="stat-item">
                                <span class="label">${s.label}</span>
                                <span class="value ${s.cls || ''}">${s.value}</span>
                            </div>
                        `).join('')}
                    </div>
                `;

                // 内容
                const infoHtml = d.infoLines.map(line => `
                    <div class="info-line">
                        <div class="info-tag">
                            <span class="icon ${line.iconCls}">${line.icon}</span>
                            ${line.label}
                        </div>
                        <span class="value-text">${line.value}</span>
                    </div>
                `).join('');

                const legendHtml = d.pieLegend.map(l => `
                    <div><span class="legend-dot" style="background:${l.color};"></span>${l.label} ${l.pct}</div>
                `).join('');

                const rankRowsHtml = d.rows.map(r => {
                    const cols = d.hasCol4 ? `
                        <span>${r.col1}</span>
                        <span>${r.col2}</span>
                        <span class="${r.col3Cls || ''}">${r.col3 || ''}</span>
                    ` : `
                        <span class="fw-600">${r.col1}</span>
                        <span class="text-muted">${r.col2}</span>
                        <span></span>
                    `;
                    return `
                        <div class="rank-item">
                            <span class="rank-num ${r.rankCls}">${r.rank}</span>
                            <div><div>${r.name}</div><span class="cate-tag">${r.cat}</span></div>
                            ${cols}
                        </div>
                    `;
                }).join('');

                const filterHtml = d.filters.map(f =>
                    `<button class="filter-btn ${f === d.filters[0] ? 'active' : ''}">${f}</button>`
                ).join('');

                scrollContent.innerHTML = `
                    <div class="row-two">
                        <div class="col-half">
                            <div class="mod-title">${pageKey === 'turnover' ? '营业变化总览' : '销量变化总览'}</div>
                            ${infoHtml}
                        </div>
                        <div class="col-half">
                            <div class="mod-title">${pageKey === 'turnover' ? '分类营业额汇总' : '分类销量占比'}</div>
                            <div class="pie-box"><canvas id="pieChart"></canvas></div>
                            <div class="pie-legend">${legendHtml}</div>
                        </div>
                    </div>
                    <div class="rank-wrap">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div class="mod-title" style="margin-bottom:0;">${d.rankTitle} <span>${d.rankCount}</span></div>
                        </div>
                        <div class="filter-group">${filterHtml}</div>
                        <div class="rank-header">${d.headers.map(h => `<span>${h}</span>`).join('')}</div>
                        ${rankRowsHtml}
                    </div>
                `;

                // 饼图
                setTimeout(() => {
                    const canvas = document.getElementById('pieChart');
                    if (!canvas) return;
                    if (window._pieChartInstance) {
                        window._pieChartInstance.destroy();
                        window._pieChartInstance = null;
                    }
                    window._pieChartInstance = new Chart(canvas.getContext('2d'), {
                        type: 'doughnut',
                        data: {
                            labels: d.pieLabels,
                            datasets: [{
                                data: d.pieData,
                                backgroundColor: d.pieColors,
                                borderWidth: 1.5,
                                borderColor: '#ffffff',
                                hoverOffset: 6,
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            cutout: '56%',
                            plugins: { legend: { display: false } },
                            animation: { animateRotate: true, duration: 400 }
                        }
                    });
                }, 50);

                // 筛选按钮
                document.querySelectorAll('.filter-group .filter-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        this.closest('.filter-group').querySelectorAll('.filter-btn')
                            .forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                    });
                });
            }

            // ============================================================
            // 6. AI 复盘页面
            // ============================================================
            function renderAIPage() {
                pageTitle.textContent = '🧠 AI 智能复盘';
                iconMoney.classList.remove('active');
                iconBox.classList.remove('active');
                iconAI.classList.add('active');

                statsContainer.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-item"><span class="label">本月营业额</span><span class="value">¥4566</span></div>
                        <div class="stat-item"><span class="label">成交商品</span><span class="value">264种</span></div>
                        <div class="stat-item"><span class="label">到店人数</span><span class="value">311人</span></div>
                        <div class="stat-item"><span class="label">客单价</span><span class="value">¥14</span></div>
                    </div>
                `;

                scrollContent.innerHTML = `
                    <div class="ai-card">
                        <h3>📊 一键复盘报告 <span class="badge">AI 生成</span></h3>
                        <div class="quick-actions">
                            <button onclick="triggerAI('summary')">📋 本月总结</button>
                            <button onclick="triggerAI('lost')">🔍 丢单归因</button>
                            <button onclick="triggerAI('advice')">💡 改进建议</button>
                            <button onclick="triggerAI('trend')">📈 趋势预测</button>
                            <button onclick="triggerAI('full')">📄 完整报告</button>
                        </div>
                        <div id="aiResponse" class="ai-response" style="min-height:80px;">
                            💡 点击上方按钮，AI 将基于当前数据生成深度复盘报告
                        </div>
                    </div>
                    <div class="ai-card">
                        <h3>💬 智能问数</h3>
                        <p style="font-size:11px;color:#6a7f9e;margin-bottom:6px;">用自然语言提问，AI 帮你分析数据</p>
                        <div class="ai-input-row">
                            <input id="aiQuestion" placeholder="例如：为什么老客户推荐成交率那么高？" />
                            <button id="askBtn">发送</button>
                        </div>
                        <div id="qaResponse" class="ai-response" style="min-height:40px;margin-top:8px;">
                            💬 输入问题，AI 将为你解答
                        </div>
                    </div>
                `;

                // 绑定发送按钮
                document.getElementById('askBtn').addEventListener('click', function() {
                    const q = document.getElementById('aiQuestion').value.trim();
                    if (!q) return;
                   if (!window.apiKey) {
    document.getElementById('qaResponse').innerHTML = '⚠️ 请先配置 API 密钥';
    return;
}
                    askAI(q, 'qaResponse');
                });
                document.getElementById('aiQuestion').addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') document.getElementById('askBtn').click();
                });

                // 挂载全局触发函数
                window.triggerAI = function(type) {
                    if (!apiKey) {
                        document.getElementById('aiResponse').innerHTML = '⚠️ 请先配置 API 密钥';
                        return;
                    }
                    const prompts = {
                        summary: '基于以下销售数据，写一份本月销售表现总结（100字以内）：营业额¥4566，成交商品264种，到店人数311人，客单价¥14。分类占比：烟草36%、饮料26%、日用品16%、零食9%、槟榔8%、其他4%。',
                        lost: '基于以下数据，分析丢单主要原因（80字以内）：63%丢单客户实际表达的是"你不懂我"，39%说"价格不行"。老客户推荐转化率47%但团队80%精力在新客户。',
                        advice: '基于销售数据，给出3条具体可执行的改进建议（每条15字以内）。',
                        trend: '基于当前数据，预测下月营业额趋势和风险提示（60字以内）。',
                        full: `请基于以下数据，生成一份完整的销售复盘报告（300字以内），包含：1.本月表现总结 2.丢单归因分析 3.改进建议 4.下月趋势预测。
                        数据：营业额¥4566，成交264种，到店311人，客单价¥14。
                        分类占比：烟草36%、饮料26%、日用品16%、零食9%、槟榔8%、其他4%。
                        丢单分析：63%客户实际表达"你不懂我"，39%说"价格不行"。
                        老客户推荐转化率47%，但80%精力在新客户。
                        签约客户平均跟进7次，丢单客户平均跟进3次。`
                    };
                    const prompt = prompts[type] || prompts.full;
                    askAI(prompt, 'aiResponse');
                };
            }

            // ============================================================
            // 7. AI 调用核心
            // ============================================================
            async function askAI(prompt, targetId) {
                const el = document.getElementById(targetId);
                if (!el) return;
                if (isAILoading) return;

                isAILoading = true;
                el.innerHTML = `<div class="loading">AI 正在分析数据...</div>`;

                try {
                    const response = await fetch('https://apihub.agnes-ai.com/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                           Authorization: `Bearer ${window.apiKey}`
                        },
                        body: JSON.stringify({
                            model: 'agnes-2.0-flash',
                            messages: [
                                { role: 'system', content: '你是深莞区销售团队的AI复盘助手。你擅长基于销售数据做深度分析、归因和预测。回答要简洁、专业、可执行。' },
                                { role: 'user', content: prompt }
                            ],
                            temperature: 0.5,
                            max_tokens: 800
                        })
                    });

                    if (!response.ok) {
                        const err = await response.text();
                        throw new Error(`API 错误 (${response.status}): ${err}`);
                    }

                    const result = await response.json();
                    const reply = result.choices?.[0]?.message?.content || 'AI 未返回有效内容';
                    el.innerHTML = reply;

                } catch (err) {
                    el.innerHTML = `⚠️ 请求失败：${err.message}`;
                } finally {
                    isAILoading = false;
                }
            }

            // ============================================================
            // 8. 页面切换
            // ============================================================
            function switchPage(pageKey) {
                currentPage = pageKey;
                if (pageKey === 'ai') {
                    renderAIPage();
                } else {
                    renderPage(pageKey);
                }
                // 重绘饼图
                setTimeout(() => {
                    if (window._pieChartInstance) window._pieChartInstance.resize();
                }, 100);
            }

            iconMoney.addEventListener('click', () => { if (currentPage !== 'turnover') switchPage('turnover'); });
            iconBox.addEventListener('click', () => { if (currentPage !== 'sale') switchPage('sale'); });
            iconAI.addEventListener('click', () => { if (currentPage !== 'ai') switchPage('ai'); });

            // ============================================================
            // 9. Tab / 筛选 事件
            // ============================================================
            document.addEventListener('click', function(e) {
                const tab = e.target.closest('.tab-item');
                if (tab) {
                    tab.closest('.tab-group').querySelectorAll('.tab-item')
                        .forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                }
            });

            // ============================================================
            // 10. 启动
            // ============================================================
            switchPage('turnover');

            // 窗口自适应
            let resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (window._pieChartInstance) window._pieChartInstance.resize();
                }, 150);
            });

        })();
    </script>
</body>
</html>
