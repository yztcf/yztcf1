<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>深莞 · 销售智脑</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
            background: #f0f2f7;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .app {
            max-width: 480px;
            width: 100%;
            height: 100%;
            max-height: 860px;
            background: #f0f2f7;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0, 10, 30, 0.10);
            position: relative;
        }
        .app-header {
            flex-shrink: 0;
            padding: 14px 16px 6px;
            background: #f0f2f7;
            z-index: 10;
        }
        .header-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .header-row h1 {
            font-size: 18px;
            font-weight: 700;
            color: #0b1b33;
            flex-shrink: 0;
        }
        .icon-switch {
            display: flex;
            background: #ffffff;
            border-radius: 30px;
            padding: 3px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            flex-shrink: 0;
            gap: 1px;
        }
        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 30px;
            border: none;
            background: transparent;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn.active {
            background: #1a3a6b;
            box-shadow: 0 2px 8px rgba(30, 60, 120, 0.2);
            color: #fff;
        }
        .icon-btn:active {
            transform: scale(0.92);
        }
        .header-row .date-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #ffffff;
            padding: 4px 12px 4px 10px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 500;
            color: #1f3f6e;
            border: 1px solid #e6eaf2;
            margin-left: auto;
            flex-shrink: 0;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
        }
        .stats-section {
            flex-shrink: 0;
            padding: 0 0 4px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            padding: 7px 2px;
            text-align: center;
            min-height: 52px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .stat-item:nth-child(1) {
            background: linear-gradient(135deg, #1a3a6b, #2d5aa0);
            color: white;
        }
        .stat-item:nth-child(2) {
            background: linear-gradient(135deg, #0f7b4a, #1a9e6a);
            color: white;
        }
        .stat-item:nth-child(3) {
            background: linear-gradient(135deg, #a0302a, #c94038);
            color: white;
        }
        .stat-item:nth-child(4) {
            background: linear-gradient(135deg, #b8782a, #d4993a);
            color: white;
        }
        .stat-item .label {
            font-size: 8px;
            font-weight: 500;
            opacity: 0.85;
            letter-spacing: 0.2px;
            text-transform: uppercase;
        }
        .stat-item .value {
            font-size: 17px;
            font-weight: 700;
            line-height: 1.2;
            margin-top: 1px;
            color: white;
        }
        .stat-item .trend-up {
            color: #8effb2;
        }
        .stat-item .trend-down {
            color: #ffb0a0;
        }
        .search-section {
            flex-shrink: 0;
            padding: 0 0 4px;
        }
        .search-bar {
            background: #ffffff;
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 11px;
            color: #334e77;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #e6eaf2;
        }
        .search-bar span {
            opacity: 0.5;
        }
        .tab-group {
            display: flex;
            gap: 4px;
            background: #ffffff;
            border-radius: 40px;
            padding: 3px;
            margin-top: 6px;
            border: 1px solid #e6eaf2;
        }
        .tab-item {
            flex: 1;
            text-align: center;
            padding: 4px 0;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 500;
            color: #4b6589;
            border: none;
            background: transparent;
            cursor: default;
        }
        .tab-item.active {
            background: #1a3a6b;
            color: white;
            font-weight: 600;
        }
        .scroll-content {
            flex: 1;
            overflow-y: auto;
            padding: 0 14px 10px;
            -webkit-overflow-scrolling: touch;
        }
        .scroll-content::-webkit-scrollbar {
            width: 3px;
        }
        .scroll-content::-webkit-scrollbar-thumb {
            background: #c0c8d8;
            border-radius: 10px;
        }
        .row-two {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }
        .col-half {
            flex: 1;
            background: #ffffff;
            border-radius: 16px;
            padding: 10px 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
            min-width: 0;
            overflow: hidden;
        }
        .mod-title {
            font-size: 11px;
            font-weight: 600;
            color: #14273e;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
        }
        .mod-title::before {
            content: "";
            width: 3px;
            height: 12px;
            background: #2d7aff;
            border-radius: 4px;
            margin-right: 5px;
        }
        .info-line {
            display: flex;
            justify-content: space-between;
            padding: 4px 6px;
            align-items: center;
            border-radius: 6px;
            margin-bottom: 2px;
            background: #f8faff;
            border: 1px solid #eef2f9;
        }
        .info-line:last-child {
            margin-bottom: 0;
        }
        .info-tag {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 500;
            color: #1d314a;
        }
        .info-tag .icon {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            flex-shrink: 0;
        }
        .icon-star {
            background: #fff3d6;
            color: #d68b1a;
        }
        .icon-yen {
            background: #e3edff;
            color: #2d6ef0;
        }
        .icon-people {
            background: #e1ecfe;
            color: #2d6ef0;
        }
        .icon-up {
            background: #dcf9e7;
            color: #0f9d58;
        }
        .icon-down {
            background: #ffe8e3;
            color: #e74c3c;
        }
        .info-line .value-text {
            font-weight: 600;
            color: #0b1b33;
            font-size: 12px;
        }
        .pie-box {
            height: 78px;
            width: 100%;
            margin: 0 auto 1px;
        }
        .pie-legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0px 4px;
            font-size: 9px;
            color: #1b334f;
            margin-top: 2px;
        }
        .legend-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 3px;
            margin-right: 3px;
            vertical-align: middle;
        }
        .rank-wrap {
            background: #ffffff;
            border-radius: 16px;
            padding: 10px 10px 2px;
            margin-top: 6px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
        }
        .rank-wrap .mod-title {
            font-size: 11px;
            margin-bottom: 0;
        }
        .rank-wrap .mod-title span {
            font-size: 10px;
            color: #6a7f9e;
            font-weight: 400;
        }
        .filter-group {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding: 3px 0 6px;
            scrollbar-width: none;
            white-space: nowrap;
        }
        .filter-group::-webkit-scrollbar {
            display: none;
        }
        .filter-btn {
            padding: 3px 10px;
            border-radius: 30px;
            border: 1px solid #e2e8f2;
            font-size: 10px;
            font-weight: 500;
            color: #3b5780;
            background: transparent;
            flex-shrink: 0;
            cursor: pointer;
        }
        .filter-btn.active {
            background: #1a3a6b;
            color: white;
            border-color: #1a3a6b;
        }
        .filter-btn:active {
            transform: scale(0.94);
        }
        .rank-header {
            display: grid;
            grid-template-columns: 20px 1fr 38px 34px 30px;
            font-size: 9px;
            color: #697f9e;
            padding: 2px 0 5px;
            border-bottom: 1px solid #edf2f9;
        }
        .rank-item {
            display: grid;
            grid-template-columns: 20px 1fr 38px 34px 30px;
            padding: 5px 0;
            align-items: center;
            border-bottom: 1px solid #f2f6fd;
            font-size: 11px;
        }
        .rank-item:last-child {
            border-bottom: none;
        }
        .rank-num {
            width: 18px;
            height: 18px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 9px;
            color: white;
            background: #b6c6e0;
        }
        .rank-num.gold {
            background: #f5b342;
        }
        .rank-num.silver {
            background: #b0bcca;
        }
        .rank-num.bronze {
            background: #dba16a;
        }
        .cate-tag {
            font-size: 7px;
            background: #eef3fc;
            padding: 1px 5px;
            border-radius: 30px;
            color: #3a5b84;
            display: inline-block;
            margin-top: 1px;
        }
        .text-new {
            color: #e74c3c;
            font-weight: 600;
            font-size: 10px;
        }
        .text-muted {
            color: #6f87aa;
            font-size: 9px;
        }
        .fw-600 {
            font-weight: 600;
        }

        /* AI复盘页 */
        .ai-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
        }
        .ai-card h3 {
            font-size: 13px;
            color: #0b1b33;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .ai-card h3 .badge {
            font-size: 9px;
            background: #1a3a6b;
            color: white;
            padding: 1px 10px;
            border-radius: 30px;
            font-weight: 400;
        }
        .ai-card p,
        .ai-card li {
            font-size: 12px;
            color: #1d314a;
            line-height: 1.6;
        }
        .ai-card ul {
            padding-left: 18px;
            margin: 4px 0;
        }
        .ai-card .highlight-box {
            background: #f0f7ff;
            border-left: 3px solid #2d7aff;
            padding: 8px 12px;
            border-radius: 6px;
            margin: 6px 0;
            font-size: 12px;
        }
        .ai-input-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .ai-input-row input {
            flex: 1;
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid #e2e8f2;
            font-size: 12px;
            outline: none;
            background: #f8faff;
        }
        .ai-input-row input:focus {
            border-color: #2d7aff;
        }
        .ai-input-row button {
            padding: 8px 18px;
            border-radius: 30px;
            border: none;
            background: #1a3a6b;
            color: white;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }
        .ai-input-row button:active {
            transform: scale(0.95);
        }
        .ai-input-row button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .ai-response {
            background: #f8faff;
            border-radius: 12px;
            padding: 12px;
            margin-top: 10px;
            font-size: 12px;
            line-height: 1.7;
            color: #1d314a;
            white-space: pre-wrap;
            max-height: 260px;
            overflow-y: auto;
            border: 1px solid #eef2f9;
        }
        .ai-response .loading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #6a7f9e;
        }
        .ai-response .loading::after {
            content: '';
            width: 14px;
            height: 14px;
            border: 2px solid #e2e8f2;
            border-top-color: #1a3a6b;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .quick-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 8px 0 4px;
        }
        .quick-actions button {
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid #dde1ec;
            background: white;
            font-size: 10px;
            color: #3b5780;
            cursor: pointer;
        }
        .quick-actions button:active {
            transform: scale(0.94);
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }

        /* ===== 商品管理 ===== */
        .action-bar {
            display: flex;
            gap: 8px;
            margin: 6px 0 4px;
            flex-wrap: wrap;
        }
        .action-btn {
            padding: 4px 12px;
            border-radius: 30px;
            border: none;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            background: #1a3a6b;
            color: white;
        }
        .action-btn:active {
            transform: scale(0.95);
        }
        .action-btn.danger {
            background: #c94038;
        }
        .action-btn.success {
            background: #0f7b4a;
        }
        .action-btn.gold {
            background: #b8782a;
        }

        .modal-mask {
            position: fixed;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-content {
            background: #fff;
            border-radius: 20px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
        }
        .modal-content h3 {
            margin-bottom: 16px;
            font-size: 16px;
        }
        .modal-content input,
        .modal-content select {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #dde4f0;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .modal-content .btn-row {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .modal-content .btn-row button {
            padding: 8px 20px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }
        .modal-content .btn-row .cancel {
            background: #eef2f9;
            color: #4b6589;
        }
        .modal-content .btn-row .confirm {
            background: #1a3a6b;
            color: white;
        }
        .rank-item .del-btn {
            background: none;
            border: none;
            color: #c94038;
            font-size: 14px;
            cursor: pointer;
            padding: 0 4px;
        }
        .rank-item .del-btn:active {
            transform: scale(0.85);
        }

        .loading-text {
            text-align: center;
            padding: 40px 20px;
            color: #6a7f9e;
            font-size: 14px;
        }
        .loading-text .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e2e8f2;
            border-top-color: #1a3a6b;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @media (max-width: 420px) {
            body {
                padding: 4px;
            }
            .app {
                max-height: 820px;
                border-radius: 20px;
            }
            .app-header {
                padding: 10px 12px 4px;
            }
            .header-row h1 {
                font-size: 16px;
            }
            .icon-btn {
                width: 30px;
                height: 30px;
                font-size: 14px;
            }
            .header-row .date-selector {
                font-size: 10px;
                padding: 3px 8px;
            }
            .stat-item .value {
                font-size: 15px;
            }
            .stat-item {
                min-height: 44px;
                padding: 5px 2px;
            }
            .stat-item .label {
                font-size: 7px;
            }
            .search-bar {
                font-size: 10px;
                padding: 5px 12px;
            }
            .tab-item {
                font-size: 10px;
                padding: 3px 0;
            }
            .scroll-content {
                padding: 0 10px 6px;
            }
            .col-half {
                padding: 8px 6px;
            }
            .mod-title {
                font-size: 10px;
            }
            .info-line {
                padding: 3px 4px;
            }
            .info-tag {
                font-size: 10px;
            }
            .info-tag .icon {
                width: 16px;
                height: 16px;
                font-size: 8px;
            }
            .info-line .value-text {
                font-size: 11px;
            }
            .pie-box {
                height: 68px;
            }
            .pie-legend {
                font-size: 8px;
            }
            .rank-wrap {
                padding: 8px 8px 2px;
            }
            .rank-header {
                font-size: 8px;
                grid-template-columns: 18px 1fr 32px 28px 28px;
            }
            .rank-item {
                font-size: 10px;
                grid-template-columns: 18px 1fr 32px 28px 28px;
                padding: 4px 0;
            }
            .rank-num {
                width: 16px;
                height: 16px;
                font-size: 8px;
            }
            .filter-btn {
                font-size: 9px;
                padding: 2px 8px;
            }
            .ai-card {
                padding: 10px;
            }
            .ai-card h3 {
                font-size: 12px;
            }
            .ai-card p,
            .ai-card li {
                font-size: 11px;
            }
            .ai-input-row input {
                font-size: 11px;
                padding: 6px 12px;
            }
            .ai-input-row button {
                font-size: 11px;
                padding: 6px 14px;
            }
            .ai-response {
                font-size: 11px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="app">

        <div class="app-header">
            <div class="header-row">
                <h1 id="pageTitle">深莞 · 销售智脑</h1>
                <div class="icon-switch">
                    <button class="icon-btn active" data-page="page-turnover" id="iconMoney">💰</button>
                    <button class="icon-btn" data-page="page-sale" id="iconBox">📦</button>
                    <button class="icon-btn" data-page="page-ai" id="iconAI">🧠</button>
                    <button class="icon-btn" data-page="page-manage" id="iconManage">✏️</button>
                </div>
                <div class="date-selector">📅 2026/08/03</div>
            </div>

            <div class="stats-section" id="statsContainer">
                <div class="loading-text"><span class="spinner"></span>加载数据中...</div>
            </div>

            <div class="search-section">
                <div class="search-bar"><span>🔍</span> 输入商品名或条码，查看逐笔销售明细</div>
                <div class="tab-group">
                    <button class="tab-item">今日</button>
                    <button class="tab-item">周期</button>
                    <button class="tab-item active">本月</button>
                </div>
            </div>
        </div>

        <div class="scroll-content" id="scrollContent">
            <div class="loading-text"><span class="spinner"></span>加载数据中...</div>
        </div>

    </div>

    <!-- ===== 新增商品弹窗 ===== -->
    <div class="modal-mask" id="addModal">
        <div class="modal-content">
            <h3>➕ 新增商品</h3>
            <input id="newName" placeholder="商品名称（如：农村土鸡蛋）" />
            <input id="newCategory" placeholder="分类（如：日用品）" />
            <input id="newPrice" type="number" step="0.01" placeholder="单价（元）" />
            <input id="newQty" type="number" step="1" placeholder="数量（件）" />
            <div class="btn-row">
                <button class="cancel" onclick="closeAddModal()">取消</button>
                <button class="confirm" onclick="confirmAdd()">确认添加</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 0. Supabase 配置
        // ============================================================
        const SUPABASE_URL = 'https://pmqkockdjvaoiuoxvigl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Q5w_4CffRHSvpNYsnhXsAw_X_-TZpKb';
        const REPORT_DATE = '2026-08-01';

        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // 1. 全局状态
        // ============================================================
        let currentPage = 'turnover';
        let dbData = null;
        let products = [];
        let isAILoading = false;

        // ============================================================

            if (error) {

            return data || [];

        async function loadData() {
            products = await loadProducts();

            dbData = calculateReport(products);
            return { products, report: dbData };
        }

        // ============================================================
        // 4. 前端实时计算（不依赖数据库函数）
        // ============================================================
        function calculateReport(productList) {
            if (!productList || productList.length === 0) {
                return {
                    total_revenue: 0,
                    total_orders: 0,
                    total_products: 0,
                    avg_price: 0,
                    visitor_count: 311,
                    category_data: {},
                    rank_data: []
                };
            }

            // 计算总营业额和总件数
            let totalRevenue = 0;
            let totalQty = 0;
            const catMap = {};

            productList.forEach(p => {
                const rev = p.price * p.qty;
                totalRevenue += rev;
                totalQty += p.qty;
                catMap[p.category] = (catMap[p.category] || 0) + rev;
            });

            // 计算分类占比
            const categoryData = {};
            Object.keys(catMap).forEach(cat => {
                categoryData[cat] = totalRevenue > 0 ? Math.round((catMap[cat] / totalRevenue) * 100) : 0;
            });

            // 计算排行榜
            const sorted = [...productList].sort((a, b) => (b.price * b.qty) - (a.price * a.qty));
            const rankData = sorted.map((p, i) => ({
                rank: i + 1,
                name: p.name,
                category: p.category,
                revenue: Math.round(p.price * p.qty * 100) / 100,
                qty: p.qty
            }));

            return {
                total_revenue: Math.round(totalRevenue * 100) / 100,
                total_orders: totalQty,
                total_products: productList.length,
                avg_price: totalQty > 0 ? Math.round((totalRevenue / totalQty) * 100) / 100 : 0,
                visitor_count: 311,
                category_data: categoryData,
                rank_data: rankData
            };
        }

        async function addProduct(name, category, price, qty) {
            if (!name || !category || !price || !qty) {

                return false;
            }
            const { error } = await supabaseClient
                .from('products')
                .insert([{ name, category, price: parseFloat(price), qty: parseInt(qty), report_date: REPORT_DATE }]);
            if (error) {
                alert('添加失败: ' + error.message);
                return false;
            }
            await refreshAll();
            return true;
        }

        async function deleteProduct(id) {
            if (!confirm('确定要删除该商品吗？所有数据将自动重新计算。')) return;
            const { error } = await supabaseClient
                .from('products')
                .delete()
                .eq('id', id);
            if (error) {
                alert('删除失败: ' + error.message);
                return;
            }
            await refreshAll();
        }

            el.innerHTML = `<div class="loading">AI 正在分析数据...</div>`;

            try {
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${key}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            { role: 'system', content: '你是深莞区销售团队的AI复盘助手。你擅长基于销售数据做深度分析、归因和预测。回答要简洁、专业、可执行。' },
                            { role: 'user', content: prompt }
                        ],
                        temperature: 0.7,
                        max_tokens: 2000
                    })
                });

                if (!response.ok) {
                    const err = await response.text();
                    throw new Error(`API 错误 (${response.status}): ${err}`);
                }

                const result = await response.json();
                const reply = result.choices?.[0]?.message?.content || 'AI 未返回有效内容';
                el.innerHTML = reply;

            } catch (err) {
                el.innerHTML = `⚠️ 请求失败：${err.message}`;
            } finally {
                isAILoading = false;
            }
        }

        // ============================================================
        // 12. 页面切换
        // ============================================================
        function switchPage(pageKey) {
            currentPage = pageKey;
            renderPage(pageKey);
            setTimeout(() => {
                if (window._pieChartInstance) window._pieChartInstance.resize();
            }, 100);
        }

        iconMoney.addEventListener('click', () => { if (currentPage !== 'turnover') switchPage('turnover'); });
        iconBox.addEventListener('click', () => { if (currentPage !== 'sale') switchPage('sale'); });
        iconAI.addEventListener('click', () => { if (currentPage !== 'ai') switchPage('ai'); });
        iconManage.addEventListener('click', () => { if (currentPage !== 'manage') switchPage('manage'); });

        // ============================================================
        // 13. 启动
        // ============================================================
        async function init() {
            await loadData();
            const built = buildDataFromDB(dbData, products);
            if (built) {
                data = built;
                renderPage('turnover');
            } else {
                statsContainer.innerHTML = `
                    <div style="text-align:center;padding:20px;color:#e74c3c;font-size:13px;">
                        ⚠️ 数据加载失败<br>
                        <span style="font-size:11px;color:#6a7f9e;">请检查 Supabase 配置</span>
                    </div>
                `;
            }
        }

        init();

        let resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (window._pieChartInstance) window._pieChartInstance.resize();
            }, 150);
        });
    </script>
</body>
</html>
