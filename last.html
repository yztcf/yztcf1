<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>深莞 · 销售智脑</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
            background: #f0f2f7;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .app {
            max-width: 480px;
            width: 100%;
            height: 100%;
            max-height: 860px;
            background: #f0f2f7;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0, 10, 30, 0.10);
            position: relative;
        }
        .app-header {
            flex-shrink: 0;
            padding: 14px 16px 6px;
            background: #f0f2f7;
            z-index: 10;
        }
        .header-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .header-row h1 {
            font-size: 18px;
            font-weight: 700;
            color: #0b1b33;
            flex-shrink: 0;
        }
        .icon-switch {
            display: flex;
            background: #ffffff;
            border-radius: 30px;
            padding: 3px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            flex-shrink: 0;
            gap: 1px;
        }
        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 30px;
            border: none;
            background: transparent;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn.active {
            background: #1a3a6b;
            box-shadow: 0 2px 8px rgba(30, 60, 120, 0.2);
            color: #fff;
        }
        .icon-btn:active {
            transform: scale(0.92);
        }
        .header-row .date-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #ffffff;
            padding: 4px 12px 4px 10px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 500;
            color: #1f3f6e;
            border: 1px solid #e6eaf2;
            margin-left: auto;
            flex-shrink: 0;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
            cursor: pointer;
        }
        .header-row .date-selector input[type="date"] {
            border: none;
            background: transparent;
            font-size: 11px;
            font-weight: 500;
            color: #1f3f6e;
            outline: none;
            width: 100px;
            padding: 2px 0;
            cursor: pointer;
        }
        .header-row .date-selector input[type="date"]::-webkit-calendar-picker-indicator {
            opacity: 0.6;
            cursor: pointer;
        }
        .stats-section {
            flex-shrink: 0;
            padding: 0 0 4px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            padding: 7px 2px;
            text-align: center;
            min-height: 52px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .stat-item:nth-child(1) {
            background: linear-gradient(135deg, #1a3a6b, #2d5aa0);
            color: white;
        }
        .stat-item:nth-child(2) {
            background: linear-gradient(135deg, #0f7b4a, #1a9e6a);
            color: white;
        }
        .stat-item:nth-child(3) {
            background: linear-gradient(135deg, #a0302a, #c94038);
            color: white;
        }
        .stat-item:nth-child(4) {
            background: linear-gradient(135deg, #b8782a, #d4993a);
            color: white;
        }
        .stat-item .label {
            font-size: 8px;
            font-weight: 500;
            opacity: 0.85;
            letter-spacing: 0.2px;
            text-transform: uppercase;
        }
        .stat-item .value {
            font-size: 17px;
            font-weight: 700;
            line-height: 1.2;
            margin-top: 1px;
            color: white;
        }
        .stat-item .trend-up {
            color: #8effb2;
        }
        .stat-item .trend-down {
            color: #ffb0a0;
        }
        .search-section {
            flex-shrink: 0;
            padding: 0 0 4px;
        }
        .search-bar {
            background: #ffffff;
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 11px;
            color: #334e77;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #e6eaf2;
        }
        .search-bar input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 11px;
            color: #334e77;
            outline: none;
        }
        .search-bar input::placeholder {
            color: #b0bcca;
        }
        .search-bar .search-btn {
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            color: #1a3a6b;
            padding: 0 4px;
        }
        .search-bar .search-btn:active {
            transform: scale(0.9);
        }
        .tab-group {
            display: flex;
            gap: 4px;
            background: #ffffff;
            border-radius: 40px;
            padding: 3px;
            margin-top: 6px;
            border: 1px solid #e6eaf2;
        }
        .tab-item {
            flex: 1;
            text-align: center;
            padding: 4px 0;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 500;
            color: #4b6589;
            border: none;
            background: transparent;
            cursor: pointer;
        }
        .tab-item.active {
            background: #1a3a6b;
            color: white;
            font-weight: 600;
        }
        .scroll-content {
            flex: 1;
            overflow-y: auto;
            padding: 0 14px 10px;
            -webkit-overflow-scrolling: touch;
        }
        .scroll-content::-webkit-scrollbar {
            width: 3px;
        }
        .scroll-content::-webkit-scrollbar-thumb {
            background: #c0c8d8;
            border-radius: 10px;
        }
        .row-two {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }
        .col-half {
            flex: 1;
            background: #ffffff;
            border-radius: 16px;
            padding: 10px 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
            min-width: 0;
            overflow: hidden;
        }
        .mod-title {
            font-size: 11px;
            font-weight: 600;
            color: #14273e;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
        }
        .mod-title::before {
            content: "";
            width: 3px;
            height: 12px;
            background: #2d7aff;
            border-radius: 4px;
            margin-right: 5px;
        }
        .info-line {
            display: flex;
            justify-content: space-between;
            padding: 4px 6px;
            align-items: center;
            border-radius: 6px;
            margin-bottom: 2px;
            background: #f8faff;
            border: 1px solid #eef2f9;
        }
        .info-line:last-child {
            margin-bottom: 0;
        }
        .info-tag {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 500;
            color: #1d314a;
        }
        .info-tag .icon {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            flex-shrink: 0;
        }
        .icon-star {
            background: #fff3d6;
            color: #d68b1a;
        }
        .icon-yen {
            background: #e3edff;
            color: #2d6ef0;
        }
        .icon-people {
            background: #e1ecfe;
            color: #2d6ef0;
        }
        .icon-up {
            background: #dcf9e7;
            color: #0f9d58;
        }
        .icon-down {
            background: #ffe8e3;
            color: #e74c3c;
        }
        .info-line .value-text {
            font-weight: 600;
            color: #0b1b33;
            font-size: 12px;
        }
        .pie-box {
            height: 78px;
            width: 100%;
            margin: 0 auto 1px;
        }
        .pie-legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0px 4px;
            font-size: 9px;
            color: #1b334f;
            margin-top: 2px;
        }
        .legend-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 3px;
            margin-right: 3px;
            vertical-align: middle;
        }
        .rank-wrap {
            background: #ffffff;
            border-radius: 16px;
            padding: 10px 10px 2px;
            margin-top: 6px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
        }
        .rank-wrap .mod-title {
            font-size: 11px;
            margin-bottom: 0;
        }
        .rank-wrap .mod-title span {
            font-size: 10px;
            color: #6a7f9e;
            font-weight: 400;
        }
        .filter-group {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding: 3px 0 6px;
            scrollbar-width: none;
            white-space: nowrap;
        }
        .filter-group::-webkit-scrollbar {
            display: none;
        }
        .filter-btn {
            padding: 3px 10px;
            border-radius: 30px;
            border: 1px solid #e2e8f2;
            font-size: 10px;
            font-weight: 500;
            color: #3b5780;
            background: transparent;
            flex-shrink: 0;
            cursor: pointer;
        }
        .filter-btn.active {
            background: #1a3a6b;
            color: white;
            border-color: #1a3a6b;
        }
        .filter-btn:active {
            transform: scale(0.94);
        }
        .rank-header {
            display: grid;
            grid-template-columns: 20px 1fr 38px 34px 30px;
            font-size: 9px;
            color: #697f9e;
            padding: 2px 0 5px;
            border-bottom: 1px solid #edf2f9;
        }
        .rank-item {
            display: grid;
            grid-template-columns: 20px 1fr 38px 34px 30px;
            padding: 5px 0;
            align-items: center;
            border-bottom: 1px solid #f2f6fd;
            font-size: 11px;
        }
        .rank-item:last-child {
            border-bottom: none;
        }
        .rank-num {
            width: 18px;
            height: 18px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 9px;
            color: white;
            background: #b6c6e0;
        }
        .rank-num.gold {
            background: #f5b342;
        }
        .rank-num.silver {
            background: #b0bcca;
        }
        .rank-num.bronze {
            background: #dba16a;
        }
        .cate-tag {
            font-size: 7px;
            background: #eef3fc;
            padding: 1px 5px;
            border-radius: 30px;
            color: #3a5b84;
            display: inline-block;
            margin-top: 1px;
        }
        .text-new {
            color: #e74c3c;
            font-weight: 600;
            font-size: 10px;
        }
        .text-muted {
            color: #6f87aa;
            font-size: 9px;
        }
        .fw-600 {
            font-weight: 600;
        }

        .action-bar {
            display: flex;
            gap: 8px;
            margin: 6px 0 4px;
            flex-wrap: wrap;
        }
        .action-btn {
            padding: 4px 12px;
            border-radius: 30px;
            border: none;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            background: #1a3a6b;
            color: white;
        }
        .action-btn:active {
            transform: scale(0.95);
        }
        .action-btn.danger {
            background: #c94038;
        }
        .action-btn.success {
            background: #0f7b4a;
        }
        .action-btn.gold {
            background: #b8782a;
        }

        .modal-mask {
            position: fixed;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-content {
            background: #fff;
            border-radius: 20px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
        }
        .modal-content h3 {
            margin-bottom: 16px;
            font-size: 16px;
        }
        .modal-content input,
        .modal-content select {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #dde4f0;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .modal-content .btn-row {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .modal-content .btn-row button {
            padding: 8px 20px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }
        .modal-content .btn-row .cancel {
            background: #eef2f9;
            color: #4b6589;
        }
        .modal-content .btn-row .confirm {
            background: #1a3a6b;
            color: white;
        }
        .rank-item .del-btn {
            background: none;
            border: none;
            color: #c94038;
            font-size: 14px;
            cursor: pointer;
            padding: 0 4px;
        }
        .rank-item .del-btn:active {
            transform: scale(0.85);
        }
        .loading-text {
            text-align: center;
            padding: 40px 20px;
            color: #6a7f9e;
            font-size: 14px;
        }
        .loading-text .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e2e8f2;
            border-top-color: #1a3a6b;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .manage-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .manage-item {
            display: grid;
            grid-template-columns: 1fr 60px 70px 30px;
            align-items: center;
            padding: 6px 8px;
            background: #f8faff;
            border-radius: 6px;
            border: 1px solid #eef2f9;
            font-size: 12px;
            gap: 4px;
        }
        .manage-item .m-name {
            font-weight: 600;
            color: #0b1b33;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .manage-item .m-cat {
            font-size: 10px;
            color: #6a7f9e;
            background: #eef3fc;
            padding: 1px 8px;
            border-radius: 30px;
            text-align: center;
            white-space: nowrap;
        }
        .manage-item .m-detail {
            text-align: right;
            font-size: 11px;
            color: #1d314a;
            white-space: nowrap;
        }
        .manage-item .m-del {
            text-align: center;
            color: #c94038;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background: none;
            padding: 0;
        }
        .manage-item .m-del:active {
            transform: scale(0.85);
        }

        @media (max-width: 420px) {
            body {
                padding: 4px;
            }
            .app {
                max-height: 820px;
                border-radius: 20px;
            }
            .app-header {
                padding: 10px 12px 4px;
            }
            .header-row h1 {
                font-size: 16px;
            }
            .icon-btn {
                width: 30px;
                height: 30px;
                font-size: 14px;
            }
            .header-row .date-selector input[type="date"] {
                width: 80px;
                font-size: 10px;
            }
            .header-row .date-selector {
                font-size: 10px;
                padding: 3px 8px;
            }
            .stat-item .value {
                font-size: 15px;
            }
            .stat-item {
                min-height: 44px;
                padding: 5px 2px;
            }
            .stat-item .label {
                font-size: 7px;
            }
            .search-bar {
                font-size: 10px;
                padding: 5px 12px;
            }
            .tab-item {
                font-size: 10px;
                padding: 3px 0;
            }
            .scroll-content {
                padding: 0 10px 6px;
            }
            .col-half {
                padding: 8px 6px;
            }
            .mod-title {
                font-size: 10px;
            }
            .info-line {
                padding: 3px 4px;
            }
            .info-tag {
                font-size: 10px;
            }
            .info-tag .icon {
                width: 16px;
                height: 16px;
                font-size: 8px;
            }
            .info-line .value-text {
                font-size: 11px;
            }
            .pie-box {
                height: 68px;
            }
            .pie-legend {
                font-size: 8px;
            }
            .rank-wrap {
                padding: 8px 8px 2px;
            }
            .rank-header {
                font-size: 8px;
                grid-template-columns: 18px 1fr 32px 28px 28px;
            }
            .rank-item {
                font-size: 10px;
                grid-template-columns: 18px 1fr 32px 28px 28px;
                padding: 4px 0;
            }
            .rank-num {
                width: 16px;
                height: 16px;
                font-size: 8px;
            }
            .filter-btn {
                font-size: 9px;
                padding: 2px 8px;
            }
            .manage-item {
                grid-template-columns: 1fr 50px 60px 24px;
                font-size: 11px;
                padding: 4px 6px;
            }
        }
    </style>
</head>
<body>
    <div class="app">

        <div class="app-header">
            <div class="header-row">
                <h1 id="pageTitle">深莞 · 销售智脑</h1>
                <div class="icon-switch">
                    <button class="icon-btn active" data-page="page-turnover" id="iconMoney">💰</button>
                    <button class="icon-btn" data-page="page-sale" id="iconBox">📦</button>
                    <button class="icon-btn" data-page="page-ai" id="iconAI">🧠</button>
                    <button class="icon-btn" data-page="page-manage" id="iconManage">✏️</button>
                </div>
                <div class="date-selector" id="dateSelector">
                    📅
                    <input type="date" id="datePicker" value="">
                </div>
            </div>

            <div class="stats-section" id="statsContainer">
                <div class="loading-text"><span class="spinner"></span>加载数据中...</div>
            </div>

            <div class="search-section">
                <div class="search-bar">
                    <span>🔍</span>
                    <input type="text" id="searchInput" placeholder="输入商品名或条码，查看逐笔销售明细">
                    <button class="search-btn" id="searchBtn">▶</button>
                </div>
                <div class="tab-group" id="timeTabs">
                    <button class="tab-item active" data-period="today">今日</button>
                    <button class="tab-item" data-period="week">周期</button>
                    <button class="tab-item" data-period="month">本月</button>
                </div>
            </div>
        </div>

        <div class="scroll-content" id="scrollContent">
            <div class="loading-text"><span class="spinner"></span>加载数据中...</div>
        </div>

    </div>

    <!-- 新增商品弹窗 -->
    <div class="modal-mask" id="addModal">
        <div class="modal-content">
            <h3>➕ 新增商品</h3>
            <input id="newName" placeholder="商品名称（如：农村土鸡蛋）" />
            <input id="newCategory" placeholder="分类（如：日用品）" />
            <input id="newPrice" type="number" step="0.01" placeholder="单价（元）" />
            <input id="newQty" type="number" step="1" placeholder="数量（件）" />
            <div class="btn-row">
                <button class="cancel" onclick="closeAddModal()">取消</button>
                <button class="confirm" onclick="confirmAdd()">确认添加</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 0. Supabase 配置
        // ============================================================
        const SUPABASE_URL = 'https://pmqkockdjvaoiuoxvigl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Q5w_4CffRHSvpNYsnhXsAw_X_-TZpKb';

        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // 1. 全局状态
        // ============================================================
        let currentPage = 'turnover';
        let currentPeriod = 'today';
        let selectedDate = '';
        let allProducts = [];
        let currentProducts = [];
        let currentReport = null;
        let isSearchMode = false;
        let searchResults = [];

        // ============================================================
        // 2. DOM 引用
        // ============================================================
        const statsContainer = document.getElementById('statsContainer');
        const scrollContent = document.getElementById('scrollContent');
        const pageTitle = document.getElementById('pageTitle');
        const iconMoney = document.getElementById('iconMoney');
        const iconBox = document.getElementById('iconBox');
        const iconAI = document.getElementById('iconAI');
        const iconManage = document.getElementById('iconManage');
        const datePicker = document.getElementById('datePicker');
        const timeTabs = document.getElementById('timeTabs');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');

        // ============================================================
        // 3. 日期工具
        // ============================================================
        function getToday() {
            const d = new Date();
            return d.toISOString().split('T')[0];
        }

        function getWeekStart() {
            const d = new Date();
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            d.setDate(diff);
            return d.toISOString().split('T')[0];
        }

        function getMonthStart() {
            const d = new Date();
            d.setDate(1);
            return d.toISOString().split('T')[0];
        }

        function formatDateDisplay(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr + 'T00:00:00');
            return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
        }

        // ============================================================
        // 4. 数据加载（包含 visitor_count）
        // ============================================================
        async function loadAllProducts() {
            const { data, error } = await supabaseClient
                .from('products')
                .select('*')
                .order('report_date', { ascending: true });

            if (error) {
                console.error('加载商品失败:', error);
                return [];
            }
            return data || [];
        }

        async function loadReport(date) {
            const { data, error } = await supabaseClient
                .from('monthly_reports')
                .select('*')
                .eq('report_date', date)
                .limit(1);

            if (error) {
                console.error('加载报表失败:', error);
                return null;
            }
            return data?.[0] || null;
        }

        // 前端计算汇总（使用 visitor_count）
        function calculateReport(products, report) {
            if (!products || products.length === 0) {
                return {
                    total_revenue: 0,
                    total_orders: 0,
                    total_products: 0,
                    avg_price: 0,
                    visitor_count: report?.visitor_count || 0,
                    category_data: {},
                    rank_data: []
                };
            }

            let totalRevenue = 0;
            let totalQty = 0;
            const catMap = {};

            products.forEach(p => {
                const rev = p.price * p.qty;
                totalRevenue += rev;
                totalQty += p.qty;
                catMap[p.category] = (catMap[p.category] || 0) + rev;
            });

            const categoryData = {};
            Object.keys(catMap).forEach(cat => {
                categoryData[cat] = totalRevenue > 0 ? Math.round((catMap[cat] / totalRevenue) * 100) : 0;
            });

            const sorted = [...products].sort((a, b) => (b.price * b.qty) - (a.price * a.qty));
            const rankData = sorted.map((p, i) => ({
                rank: i + 1,
                name: p.name,
                category: p.category,
                revenue: Math.round(p.price * p.qty * 100) / 100,
                qty: p.qty,
                id: p.id
            }));

            // 客单价 = 总营业额 / 总件数
            const avgPrice = totalQty > 0 ? Math.round((totalRevenue / totalQty) * 100) / 100 : 0;

            return {
                total_revenue: Math.round(totalRevenue * 100) / 100,
                total_orders: totalQty,
                total_products: products.length,
                avg_price: avgPrice,
                visitor_count: report?.visitor_count || 0,
                category_data: categoryData,
                rank_data: rankData
            };
        }

        // ============================================================
        // 5. 数据刷新
        // ============================================================
        async function refreshData() {
            allProducts = await loadAllProducts();

            // 确定查询日期
            let queryDate = selectedDate || getToday();
            currentProducts = allProducts.filter(p => p.report_date === queryDate);

            // 加载该日期的报表（包含 visitor_count）
            const report = await loadReport(queryDate);

            currentReport = calculateReport(currentProducts, report);

            // 更新日期选择器
            datePicker.value = queryDate;

            renderPage(currentPage);
        }

        // ============================================================
        // 6. CRUD 操作（自动增加 visitor_count）
        // ============================================================
        async function addProduct(name, category, price, qty) {
            if (!name || !category || !price || !qty) {
                alert('请填写完整信息');
                return false;
            }

            const today = getToday();

            // 1. 插入商品
            const { error: insertError } = await supabaseClient
                .from('products')
                .insert([{
                    name,
                    category,
                    price: parseFloat(price),
                    qty: parseInt(qty),
                    report_date: today
                }]);

            if (insertError) {
                alert('添加失败: ' + insertError.message);
                return false;
            }

            // 2. 更新 visitor_count（到店人数 +1）
            const { data: existing } = await supabaseClient
                .from('monthly_reports')
                .select('visitor_count')
                .eq('report_date', today)
                .limit(1);

            const currentCount = existing?.[0]?.visitor_count || 0;
            const newCount = currentCount + 1;

            const { error: updateError } = await supabaseClient
                .from('monthly_reports')
                .upsert({
                    report_date: today,
                    visitor_count: newCount
                }, { onConflict: 'report_date' });

            if (updateError) {
                console.error('更新 visitor_count 失败:', updateError);
            }

            // 3. 刷新数据
            await refreshData();
            return true;
        }

        async function deleteProduct(id) {
            if (!confirm('确定要删除该商品吗？所有数据将自动重新计算。')) return;

            // 找到要删除的商品
            const product = allProducts.find(p => p.id === id);
            if (!product) return;

            // 删除商品
            const { error: deleteError } = await supabaseClient
                .from('products')
                .delete()
                .eq('id', id);

            if (deleteError) {
                alert('删除失败: ' + deleteError.message);
                return;
            }

            // 刷新数据（visitor_count 保持不变，因为到店人数是累计的）
            await refreshData();
        }

        function performSearch() {
            const keyword = searchInput.value.trim();
            if (!keyword) {

                refreshData();
                return;
            }

            const results = allProducts.filter(p =>
                p.name.includes(keyword) ||
                p.category.includes(keyword) ||
                p.id.toString() === keyword
            );

            if (results.length === 0) {
                alert('⚠️ 未找到匹配的商品，请检查商品名或条码是否正确');
                isSearchMode = false;
                searchResults = [];

            currentProducts = results;
            const report = currentReport;
            currentReport = calculateReport(results, report);
            renderPage(currentPage);
        }

                        <button onclick="triggerAI('summary')" style="padding:4px 12px;border-radius:30px;border:1px solid #dde1ec;background:white;font-size:10px;color:#3b5780;cursor:pointer;">📋 本月总结</button>
                        <button onclick="triggerAI('lost')" style="padding:4px 12px;border-radius:30px;border:1px solid #dde1ec;background:white;font-size:10px;color:#3b5780;cursor:pointer;">🔍 丢单归因</button>
                        <button onclick="triggerAI('advice')" style="padding:4px 12px;border-radius:30px;border:1px solid #dde1ec;background:white;font-size:10px;color:#3b5780;cursor:pointer;">💡 改进建议</button>
                        <button onclick="triggerAI('trend')" style="padding:4px 12px;border-radius:30px;border:1px solid #dde1ec;background:white;font-size:10px;color:#3b5780;cursor:pointer;">📈 趋势预测</button>
                        <button onclick="triggerAI('full')" style="padding:4px 12px;border-radius:30px;border:1px solid #dde1ec;background:white;font-size:10px;color:#3b5780;cursor:pointer;">📄 完整报告</button>
                    </div>
                    <div id="aiResponse" style="background:#f8faff;border-radius:12px;padding:12px;margin-top:10px;font-size:12px;line-height:1.7;color:#1d314a;white-space:pre-wrap;max-height:260px;overflow-y:auto;border:1px solid #eef2f9;min-height:80px;">
                        💡 点击上方按钮，AI 将基于当前数据生成深度复盘报告
                    </div>
                </div>
                <div class="ai-card" style="background:#ffffff;border-radius:16px;padding:14px;margin-bottom:8px;box-shadow:0 2px 12px rgba(0,0,0,0.02);">
                    <h3 style="font-size:13px;color:#0b1b33;margin-bottom:6px;">💬 智能问数</h3>
                    <p style="font-size:11px;color:#6a7f9e;margin-bottom:6px;">用自然语言提问，AI 帮你分析数据</p>
                    <div style="display:flex;gap:8px;margin-top:10px;">
                        <input id="aiQuestion" placeholder="例如：为什么老客户推荐成交率那么高？" style="flex:1;padding:8px 14px;border-radius:30px;border:1px solid #e2e8f2;font-size:12px;outline:none;background:#f8faff;" />
                        <button id="askBtn" style="padding:8px 18px;border-radius:30px;border:none;background:#1a3a6b;color:white;font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap;">发送</button>
                    </div>
                    <div id="qaResponse" style="background:#f8faff;border-radius:12px;padding:12px;margin-top:10px;font-size:12px;line-height:1.7;color:#1d314a;white-space:pre-wrap;max-height:260px;overflow-y:auto;border:1px solid #eef2f9;min-height:40px;">
                        💬 输入问题，AI 将为你解答
                    </div>
                </div>
            `;

            document.getElementById('askBtn').addEventListener('click', function() {
                const q = document.getElementById('aiQuestion').value.trim();
                if (!q) return;
                askAI(q, 'qaResponse');
            });
            document.getElementById('aiQuestion').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') document.getElementById('askBtn').click();
            });

            window.triggerAI = function(type) {
                const r = currentReport || {};
                const prompts = {
                    summary: `基于以下销售数据，写一份本月销售表现总结（100字以内）：营业额¥${r.total_revenue || 0}，成交商品${r.total_products || 0}种，到店人数${r.visitor_count || 0}人，客单价¥${Math.round(r.avg_price || 0)}。分类占比：${JSON.stringify(r.category_data || {})}。`,
                    lost: '基于以下数据，分析丢单主要原因（80字以内）：63%丢单客户实际表达的是"你不懂我"，39%说"价格不行"。老客户推荐转化率47%但团队80%精力在新客户。',
                    advice: '基于销售数据，给出3条具体可执行的改进建议（每条15字以内）。',
                    trend: '基于当前数据，预测下月营业额趋势和风险提示（60字以内）。',
                    full: `请基于以下数据，生成一份完整的销售复盘报告（300字以内），包含：1.本月表现总结 2.丢单归因分析 3.改进建议 4.下月趋势预测。数据：营业额¥${r.total_revenue || 0}，成交${r.total_products || 0}种，到店${r.visitor_count || 0}人，客单价¥${Math.round(r.avg_price || 0)}。分类占比：${JSON.stringify(r.category_data || {})}。丢单分析：63%客户实际表达"你不懂我"，39%说"价格不行"。老客户推荐转化率47%，但80%精力在新客户。签约客户平均跟进7次，丢单客户平均跟进3次。`
                };
                const prompt = prompts[type] || prompts.full;
                askAI(prompt, 'aiResponse');
            };
        }

        async function askAI(prompt, targetId) {
            const el = document.getElementById(targetId);
            if (!el) return;
            if (window._isAILoading) return;

            const key = localStorage.getItem('deepseek_api_key') || 'sk-d3c3759509594ada95fd20dc57066670';
            if (!key) {
                el.innerHTML = '⚠️ 请先配置 API 密钥';
                return;
            }

            window._isAILoading = true;
            el.innerHTML = `<div style="display:flex;align-items:center;gap:8px;color:#6a7f9e;"><div style="display:inline-block;width:14px;height:14px;border:2px solid #e2e8f2;border-top-color:#1a3a6b;border-radius:50%;animation:spin 0.7s linear infinite;"></div>AI 正在分析数据...</div>`;

            try {
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${key}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            { role: 'system', content: '你是深莞区销售团队的AI复盘助手。你擅长基于销售数据做深度分析、归因和预测。回答要简洁、专业、可执行。' },
                            { role: 'user', content: prompt }
                        ],
                        temperature: 0.7,
                        max_tokens: 2000
                    })
                });

                if (!response.ok) {
                    const err = await response.text();
                    throw new Error(`API 错误 (${response.status}): ${err}`);
                }

                const result = await response.json();
                const reply = result.choices?.[0]?.message?.content || 'AI 未返回有效内容';
                el.innerHTML = reply;

            } catch (err) {
                el.innerHTML = `⚠️ 请求失败：${err.message}`;
            } finally {
                window._isAILoading = false;
            }
        }

        // ============================================================
        // 页面切换
        // ============================================================
        function switchPage(pageKey) {
            currentPage = pageKey;
            if (pageKey === 'manage' || pageKey === 'ai') {
                isSearchMode = false;
                searchResults = [];
                searchInput.value = '';
                refreshData();
                return;
            }
            renderPage(pageKey);
            setTimeout(() => {
                if (window._pieChartInstance) window._pieChartInstance.resize();
            }, 100);
        }

        iconMoney.addEventListener('click', () => { if (currentPage !== 'turnover') switchPage('turnover'); });
        iconBox.addEventListener('click', () => { if (currentPage !== 'sale') switchPage('sale'); });
        iconAI.addEventListener('click', () => { if (currentPage !== 'ai') switchPage('ai'); });
        iconManage.addEventListener('click', () => { if (currentPage !== 'manage') switchPage('manage'); });

        // ============================================================
        // 日期选择器
        // ============================================================
        datePicker.addEventListener('change', function() {
            selectedDate = this.value;
            if (selectedDate) {
                document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
                currentPeriod = 'custom';
                refreshData();
            } else {
                selectedDate = '';
                document.querySelector('.tab-item[data-period="today"]')?.classList.add('active');
                currentPeriod = 'today';
                refreshData();
            }
        });

        // ============================================================
        // 时间Tab切换
        // ============================================================
        document.querySelectorAll('.tab-item').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentPeriod = this.dataset.period;
                selectedDate = '';
                datePicker.value = getToday();
                isSearchMode = false;
                searchResults = [];
                searchInput.value = '';
                refreshData();
            });
        });

        // ============================================================
        // 搜索事件
        // ============================================================
        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                performSearch();
            }
        });

        // ============================================================
        // 启动
        // ============================================================
        async function init() {
            const today = getToday();
            datePicker.value = today;
            await refreshData();
        }

        init();

        let resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (window._pieChartInstance) window._pieChartInstance.resize();
            }, 150);
        });
    </script>
</body>
</html>
