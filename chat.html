<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n-title="_title.contact">留言 · 叶志挺</title>
  <meta name="description" data-i18n-content="_desc.contact" content="给叶志挺 (LIXUWEI) 留言。无需登录，先审后发。">
  <link rel="canonical" href="https://apodfg.com/contact/">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://apodfg.com/contact/">
  <meta property="og:title" content="留言 · 叶志挺">
  <meta property="og:description" content="给叶志挺 (LIXUWEI) 留言。无需登录，先审后发。">
  <meta property="og:image" content="https://apodfg.com/favicon.svg">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  
  <!-- ⭐ 保留您的外部样式 -->
  <link rel="stylesheet" href="static/css/style.css">
  
  <!-- 引入 Supabase 客户端 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    (() => {
      const t = localStorage.getItem('theme');
      const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      const l = localStorage.getItem('lang');
      const lang = (l === 'en' || l === 'zh') ? l : 'zh';
      document.documentElement.dataset.lang = lang;
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    })();
  </script>
  
  <!-- ⭐ 只添加精选留言相关的额外样式 -->
  <style>
    /* 精选筛选按钮 */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .filter-bar button {
      padding: 6px 16px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: transparent;
      color: var(--fg-muted);
      cursor: pointer;
      transition: all .15s ease;
      font-size: 13px;
    }
    .filter-bar button:hover {
      border-color: var(--fg);
      color: var(--fg);
    }
    .filter-bar button.active {
      background: var(--fg);
      color: var(--bg);
      border-color: var(--fg);
    }
    
    /* 精选留言高亮 */
    .msg.featured {
      border-color: #f9a825;
      background: linear-gradient(to right, var(--chip-bg), rgba(249, 168, 37, 0.06));
    }
    
    /* 精选徽章 */
    .featured-badge {
      display: inline-block;
      font-size: 11px;
      background: #f9a825;
      color: #fff;
      padding: 1px 10px;
      border-radius: 12px;
      margin-left: 6px;
      font-weight: 600;
    }
    
    /* 留言列表头部 flex 布局 */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    
    .form .status.error {
      color: #d32f2f;
    }
  </style>
</head>
<body>
  <!-- 页面内容保持不变，使用您原来的结构 -->
  <header class="site-header">
    <div class="site-header-inner">
      <div class="brand">
        <a href="index.html" class="brand-name">Xuwei</a>
      </div>
      <nav class="site-nav" data-i18n-aria-label="aria.mainNav" aria-label="主导航">
        <a href="index.html" data-i18n="nav.home">首页</a>
        <a href="index1.html" target="_blank" rel="noopener noreferrer" data-i18n="nav.blog">博客</a>
        <button id="lang-toggle" class="theme-toggle lang-toggle" type="button" data-i18n-aria-label="aria.toggleLang" aria-label="切换语言">
          <span data-i18n="langLabel">EN</span>
        </button>
        <button id="theme-toggle" class="theme-toggle" type="button" data-i18n-aria-label="aria.toggleTheme" aria-label="切换主题">
          <svg class="icon icon-sun" viewbox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"></circle>
            <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path>
            </g>
          </svg>
          <svg class="icon icon-moon" viewbox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.5A8 8 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path>
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="container is-flow">
    <section class="hero">
      <h1 class="hero-title">
        <span class="sparkle" aria-hidden="true">✉️</span>
        <span data-i18n="contact.heroTitle">留言</span>
      </h1>
      <p class="hero-desc" data-i18n="contact.heroDesc">想说点什么都可以，有些留言会展示。</p>
    </section>

    <form class="form" id="msg-form" autocomplete="off" novalidate>
      <div class="row">
        <label for="nickname" data-i18n="form.nickname">昵称</label>
        <input id="nickname" name="nickname" type="text" maxlength="32" required>
      </div>
      <div class="row">
        <label for="body" data-i18n="form.body">内容</label>
        <textarea id="body" name="body" maxlength="500" required></textarea>
        <span class="hint" id="counter">0 / 500</span>
      </div>
      <input class="hp" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="submit-row">
        <button type="submit" id="submit-btn" data-i18n="form.submit">提交</button>
        <span class="status" id="status" role="status" aria-live="polite"></span>
      </div>
    </form>

    <div class="section-header">
      <h2 class="section-title" style="margin:0;" data-i18n="list.section">展示的留言</h2>
      <div class="filter-bar" style="margin:0;">
        <button class="active" data-filter="all">全部</button>
        <button data-filter="featured">⭐ 精选</button>
      </div>
    </div>
    <div class="msg-list" id="list">
      <p class="empty" id="empty" data-i18n="list.loading">加载中…</p>
    </div>
    <div class="more" id="more" hidden>
      <button type="button" id="more-btn" data-i18n="list.more">加载更多</button>
    </div>
  </main>

  <footer class="site-footer">
    <small>2026 © LIXUWEI</small>
    <small style="display:block;font-style:normal;"><a href="https://beian.miit.gov.cn" target="_blank" rel="noopener noreferrer">闽ICP备2026017342号-1</a></small>
  </footer>

  <script src="static/js/script.js" defer></script>
  <script>
    // ============================================================
    // Supabase 配置
    // ============================================================
    const supabaseUrl = "https://pmqkockdjvaoiuoxvigl.supabase.co"
    const supabaseKey = "sb_publishable_Q5w_4CffRHSvpNYsnhXsAw_X_-TZpKb"
    
    document.addEventListener('DOMContentLoaded', () => {
      const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
      
      const form = document.getElementById('msg-form');
      const nick = document.getElementById('nickname');
      const body = document.getElementById('body');
      const counter = document.getElementById('counter');
      const submitBtn = document.getElementById('submit-btn');
      const statusEl = document.getElementById('status');
      const listEl = document.getElementById('list');
      const moreWrap = document.getElementById('more');
      const moreBtn = document.getElementById('more-btn');
      const filterBtns = document.querySelectorAll('.filter-bar button');

      let currentFilter = 'all';
      let lastId = null;
      let isLoading = false;
      let hasMore = true;

      // ============================================================
      // 工具函数
      // ============================================================
      function fmt(ts) {
        if (!ts) return '';
        const d = new Date(ts);
        const pad = n => String(n).padStart(2, '0');
        return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
      }

      function setStatus(msg, type = '') {
        statusEl.textContent = msg;
        statusEl.className = 'status' + (type ? ' ' + type : '');
      }

      function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function buildCard(m) {
        const card = document.createElement('div');
        card.className = 'msg' + (m.is_featured ? ' featured' : '');
        card.dataset.id = String(m.id);
        card.__data = m;
        
        let html = `
          <div class="head">
            <span>
              <span class="nick">${escapeHtml(m.nickname || '匿名')}</span>
              ${m.is_featured ? '<span class="featured-badge">⭐ 精选</span>' : ''}
              <span class="region">${m.region ? '· ' + escapeHtml(m.region) : ''}</span>
            </span>
            <span class="when">${fmt(m.created_at)}</span>
          </div>
          <div class="body">${escapeHtml(m.body || '')}</div>
        `;
        
        if (m.reply_body) {
          html += `
            <div class="reply">
              <div class="reply-label">站长回复 · ${fmt(m.reply_at)}</div>
              <div class="reply-body">${escapeHtml(m.reply_body)}</div>
            </div>
          `;
        }
        
        card.innerHTML = html;
        return card;
      }

      // ============================================================
      // 加载留言
      // ============================================================
      async function loadMessages(append = false) {
        if (isLoading) return;
        if (!append) {
          lastId = null;
          hasMore = true;
          listEl.innerHTML = '';
        }
        if (!hasMore && append) return;

        isLoading = true;
        if (!append) {
          const loadingEl = document.createElement('p');
          loadingEl.className = 'empty';
          loadingEl.id = 'empty';
          loadingEl.textContent = '加载中…';
          listEl.appendChild(loadingEl);
        }

        try {
          let query = supabase
            .from('messages')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(20);

          if (currentFilter === 'featured') {
            query = query.eq('is_featured', true);
          }

          if (lastId && append) {
            query = query.lt('id', lastId);
          }

          const { data, error } = await query;
          
          if (error) {
            console.error('Supabase 错误:', error);
            throw new Error(error.message || '查询失败');
          }

          const existingEmpty = document.getElementById('empty');
          if (existingEmpty) existingEmpty.remove();

          if (!data || data.length === 0) {
            if (!append) {
              const emptyMsg = document.createElement('p');
              emptyMsg.className = 'empty';
              emptyMsg.id = 'empty';
              emptyMsg.textContent = currentFilter === 'featured' 
                ? '还没有精选留言 🤔' 
                : '还没有留言，快来抢沙发！';
              listEl.appendChild(emptyMsg);
            }
            hasMore = false;
            moreWrap.hidden = true;
            return;
          }

          if (data.length > 0) {
            lastId = data[data.length - 1].id;
          }

          if (!append) {
            listEl.innerHTML = '';
          }
          data.forEach(msg => {
            listEl.appendChild(buildCard(msg));
          });

          hasMore = data.length === 20;
          moreWrap.hidden = !hasMore;

        } catch (err) {
          console.error('加载留言失败:', err);
          const existingEmpty = document.getElementById('empty');
          if (existingEmpty) existingEmpty.remove();
          
          const emptyMsg = document.createElement('p');
          emptyMsg.className = 'empty';
          emptyMsg.id = 'empty';
          emptyMsg.textContent = '加载失败: ' + (err.message || '未知错误');
          listEl.appendChild(emptyMsg);
          moreWrap.hidden = true;
        } finally {
          isLoading = false;
        }
      }

      // ============================================================
      // 提交留言
      // ============================================================
      async function submitMessage(e) {
        e.preventDefault();
        
        const nickname = nick.value.trim();
        const content = body.value.trim();
        
        if (!nickname || !content) {
          setStatus('请填写昵称和内容', 'error');
          return;
        }
        if (content.length < 2) {
          setStatus('内容至少 2 个字符', 'error');
          return;
        }

        setStatus('提交中…', '');
        submitBtn.disabled = true;

        try {
          const { data, error } = await supabase
            .from('messages')
            .insert([
              {
                nickname: nickname,
                body: content,
                region: null,
                is_featured: false,
              }
            ])
            .select();

          if (error) {
            console.error('提交错误:', error);
            throw new Error(error.message || '提交失败');
          }

          setStatus('✅ 留言提交成功！', 'ok');
          form.reset();
          counter.textContent = '0 / 500';
          
          await loadMessages(false);
          
        } catch (err) {
          console.error('提交失败:', err);
          setStatus('提交失败: ' + (err.message || '未知错误'), 'error');
        } finally {
          submitBtn.disabled = false;
        }
      }

      // ============================================================
      // 事件绑定
      // ============================================================
      body.addEventListener('input', () => {
        counter.textContent = body.value.length + ' / 500';
      });

      form.addEventListener('submit', submitMessage);

      moreBtn.addEventListener('click', () => {
        loadMessages(true);
      });

      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentFilter = btn.dataset.filter;
          loadMessages(false);
        });
      });

      // ============================================================
      // 初始化加载
      // ============================================================
      loadMessages();
      console.log('✅ 留言板已接入 Supabase');
    });
  </script>
</body>
</html>
